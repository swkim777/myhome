<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANT-EX AI 분석기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; scroll-behavior: smooth; }
        .loading-spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 분석 리포트 스타일링 */
        .report-card { border-radius: 24px; overflow: hidden; background: #fff; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .report-section { padding: 24px; border-bottom: 1px solid #f8fafc; }
        .report-section:last-child { border-bottom: none; }
        .section-title { font-size: 0.95rem; font-weight: 800; color: #4f46e5; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; width: fit-content; }
        
        .report-card ul { list-style-type: none; padding-left: 0; }
        .report-card li { position: relative; padding-left: 1.25rem; margin-bottom: 8px; color: #334155; font-size: 0.95rem; line-height: 1.6; }
        .report-card li::before { content: "•"; position: absolute; left: 0; color: #6366f1; font-weight: bold; }
        
        /* 계단식 들여쓰기 스타일 */
        .indent-1 { margin-left: 1.5rem; color: #475569 !important; font-size: 0.9rem !important; }
        .indent-1::before { content: "└" !important; color: #cbd5e1 !important; left: -1rem !important; }
        .indent-2 { margin-left: 2.5rem; color: #64748b !important; font-size: 0.85rem !important; }
        .indent-2::before { content: "-" !important; color: #e2e8f0 !important; left: -0.75rem !important; }

        .summary-box { background-color: #eef2ff; border-radius: 20px; padding: 24px; border: 2px solid #c7d2fe; margin-top: 16px; position: relative; overflow: hidden; }
        .summary-box::after { content: 'SUMMARY'; position: absolute; top: -10px; right: -10px; font-size: 3rem; font-weight: 900; color: #6366f1; opacity: 0.05; }
        .summary-title { font-weight: 900; color: #3730a3; display: block; margin-bottom: 10px; font-size: 1.1rem; }
        
        .chat-input-shadow { box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1); }
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .error-card { background-color: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; }
        .price-highlight { color: #818cf8; font-weight: 900; font-size: 0.9rem; }
    </style>
</head>
<body class="text-slate-900 min-h-screen bg-slate-50/30 pb-20">

    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center gap-4">
                <div class="flex items-center gap-2 flex-shrink-0">
                    <div class="p-1.5 bg-indigo-600 rounded-lg shadow-md shadow-indigo-200">
                        <i data-lucide="trending-up" class="text-white w-5 h-5"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-800 uppercase hidden sm:inline">Quant-Ex <span class="text-indigo-600">AI</span></span>
                </div>

                <div class="flex items-center gap-3 flex-1 justify-end max-w-md">
                    <div id="status-badge" class="flex items-center gap-2 px-2.5 py-1 bg-white border border-slate-200 rounded-full transition-all">
                        <div id="api-status-dot" class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>
                        <span id="api-status-text" class="text-[10px] font-black text-slate-500 tracking-tight uppercase">API OFF</span>
                    </div>
                    <div class="relative w-full">
                        <input type="password" id="api-key" placeholder="Enter Gemini API Key" 
                               class="w-full pl-3 pr-10 py-2 bg-white rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all text-xs font-medium">
                        <button id="btn-save-key" title="저장" class="absolute right-3 top-1.5 text-slate-400 hover:text-indigo-600 transition-colors">
                            <i data-lucide="save" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <span id="save-status" class="hidden text-[9px] font-black text-emerald-600 uppercase whitespace-nowrap">Saved</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 lg:py-12">
        <section class="space-y-12">
            <div class="text-center space-y-2 mb-12 fade-in-up">
                <h1 class="text-5xl font-black tracking-tighter text-slate-900">Gemini Chat</h1>
                <p class="text-slate-500 text-lg font-medium">전문 퀀트 분석 체계 기반 실시간 투자 엔진</p>
            </div>

            <div id="result-container" class="hidden space-y-8">
                <div id="report-history" class="space-y-12">
                    <!-- New reports will be appended here -->
                </div>

                <div id="loading-state" class="hidden flex flex-col items-center justify-center py-16 space-y-4">
                    <div class="loading-spinner"></div>
                    <div class="text-center">
                        <p class="text-indigo-600 font-bold text-lg animate-pulse">실시간 시장 검색 및 5단계 분석 실행 중</p>
                        <p class="text-slate-400 text-sm mt-1 font-medium">Investing.com, KRX 등 금융 데이터 동기화...</p>
                    </div>
                </div>
            </div>

            <div id="input-area" class="relative max-w-3xl mx-auto pt-12">
                <div class="chat-input-shadow rounded-3xl border border-slate-200 overflow-hidden bg-white focus-within:ring-4 focus-within:ring-indigo-500/10 transition-all duration-300">
                    <div class="flex items-center px-6 py-5">
                        <input type="text" id="user-input" placeholder="분석할 종목명을 입력하세요 (예: 삼성전자, 테슬라)..." 
                               class="flex-1 bg-transparent border-none focus:ring-0 text-xl outline-none placeholder:text-slate-300 font-semibold">
                        <button id="btn-send" class="p-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl transition-all active:scale-90 disabled:opacity-50 shadow-lg shadow-indigo-100">
                            <i data-lucide="send" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
                <div id="error-display" class="hidden mt-4 p-4 rounded-2xl error-card text-sm font-bold flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    <span id="error-message"></span>
                </div>
                <div class="flex flex-wrap justify-center gap-3 mt-8">
                    <button onclick="quickInput('삼성전자 현재 분석해줘')" class="text-xs font-bold text-slate-500 hover:text-indigo-600 px-5 py-2.5 rounded-full border border-slate-200 bg-white hover:border-indigo-200 transition-all shadow-sm">#삼성전자</button>
                    <button onclick="quickInput('엔비디아 스윙 전략 분석')" class="text-xs font-bold text-slate-500 hover:text-indigo-600 px-5 py-2.5 rounded-full border border-slate-200 bg-white hover:border-indigo-200 transition-all shadow-sm">#엔비디아</button>
                    <button onclick="quickInput('나스닥 시장 환경 점검')" class="text-xs font-bold text-slate-500 hover:text-indigo-600 px-5 py-2.5 rounded-full border border-slate-200 bg-white hover:border-indigo-200 transition-all shadow-sm">#나스닥</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        lucide.createIcons();

        const STORAGE_KEY = 'quant_ex_gemini_api_key';
        const apiKeyInput = document.getElementById('api-key');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const resultContainer = document.getElementById('result-container');
        const loadingState = document.getElementById('loading-state');
        const reportHistory = document.getElementById('report-history');
        const errorDisplay = document.getElementById('error-display');
        const errorMessage = document.getElementById('error-message');
        const saveStatus = document.getElementById('save-status');

        let chatHistory = [];

        window.onload = () => {
            const cachedKey = localStorage.getItem(STORAGE_KEY);
            if (cachedKey) {
                apiKeyInput.value = cachedKey;
                updateApiStatus(true);
            }
        };

        function updateApiStatus(connected) {
            const dot = document.getElementById('api-status-dot');
            const text = document.getElementById('api-status-text');
            if (connected) {
                dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]";
                text.textContent = "API ON";
            } else {
                dot.className = "w-1.5 h-1.5 rounded-full bg-slate-300";
                text.textContent = "API OFF";
            }
        }

        function quickInput(val) {
            userInput.value = val;
            userInput.focus();
        }

        function showError(msg) {
            errorDisplay.classList.remove('hidden');
            errorMessage.textContent = msg;
            setTimeout(() => { errorDisplay.classList.add('hidden'); }, 5000);
        }

        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    const data = await response.json();
                    if (response.ok) return data;
                    if (response.status === 401 || response.status === 400) throw new Error(`API 키를 확인해 주세요.`);
                } catch (err) { if (i === maxRetries - 1) throw err; }
                await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
            }
        }

        async function startAnalysis() {
            const apiKey = apiKeyInput.value.trim();
            const query = userInput.value.trim();

            if (!apiKey) { showError('설정창에 API 키를 입력해 주세요.'); return; }
            if (!query) return;

            localStorage.setItem(STORAGE_KEY, apiKey);
            updateApiStatus(true);

            btnSend.disabled = true;
            resultContainer.classList.remove('hidden');
            loadingState.classList.remove('hidden');
            errorDisplay.classList.add('hidden');
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            const systemPrompt = `
                당신은 시니어 퀀트 애널리스트입니다. 
                사용자가 요청한 종목/시장 분석에 대해 반드시 'Google Search'를 수행하여 실시간 데이터를 참고하십시오. (Investing.com, KRX 등)

                [분석 리포트 5단계 구성 가이드]
                모든 분석 내용은 가독성을 위해 **문장식(~다)이 아닌 단답형(~함, ~임, ~마감, ~보임 등)**의 **개조식**으로 작성하십시오.

                **중요: 1번(시장 환경 분석)과 2번(기술적 분석) 섹션은 반드시 '계단식(들여쓰기)' 구조를 사용하십시오.**
                - 대분류 (📌 또는 ① 등)
                    - 중분류 (👉 또는 • 등, 들여쓰기 2칸)
                        - 소분류 (들여쓰기 4칸)

                1. 시장 환경 분석
                   - 📌 코스피 지수 흐름: 지수 영향력, 수급 상황 등.
                   - 📌 업종/섹터 지표: 업종 모멘텀 및 수급 특징.
                   - 👉 결론: 시장 환경 요약.

                2. 기술적 분석 (스윙 기준 핵심 체크포인트)
                   - ① RSI (14), ② MACD, ③ 이동평균선, ④ 거래량 항목별로 분석.
                   - 각 지표별 현재 상태와 의미를 계층적으로 표현.

                3. 시나리오별 전략 (상승/하락/과열 시나리오별 전략)
                4. 종합 판단 (업황, 추세, 전략, 리스크 명시 및 예상 기간)
                5. 리스크 관리 (체크리스트)

                마지막에 반드시 **핵심 요약** 섹션을 볼드체로 추가하고 3줄 이내로 요약하십시오.
                
                리포트 끝에 반드시 아래 JSON만 한 줄로 포함: 
                {"trend": "상승/하락/보합", "timing": "매수/관망/매도", "risk": 0-100, "price": "현재주가", "sma224": "224일선값"}
            `;

            chatHistory.push({ role: "user", parts: [{ text: query }] });

            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: chatHistory,
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    tools: [{ "google_search": {} }]
                };

                const result = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                chatHistory.push({ role: "model", parts: [{ text: rawText }] });

                const jsonRegex = /\{.*"trend".*"timing".*"risk".*"price".*\}/s;
                const jsonMatch = rawText.match(jsonRegex);
                let meta = { trend: "-", timing: "-", risk: 0, price: "N/A", sma224: "N/A" };
                if (jsonMatch) { try { meta = JSON.parse(jsonMatch[0]); } catch(e) {} }

                const contentBody = rawText.replace(jsonRegex, "");
                const sections = contentBody.split(/(?=\d\.\s|(?:\*\*핵심 요약\*\*)|(?:#\s))/);
                
                let htmlContent = `<div class="report-grid">`;
                sections.forEach((section) => {
                    const trimmed = section.trim();
                    if (!trimmed || trimmed.includes('핵심 요약')) return;

                    const titleMatch = trimmed.match(/^(\d\.\s|#\s)?(.*?)(?:\n|$)/);
                    const title = titleMatch ? titleMatch[2].replace(/\*/g, '') : `분석 결과`;
                    const lines = trimmed.split('\n').slice(1).filter(line => line.trim().length > 0);
                    
                    const listItems = lines.map(line => {
                        // 들여쓰기 수준 계산 (공백 2칸당 1단계)
                        const indentLevel = (line.match(/^ +/) || [""])[0].length;
                        let className = "";
                        if (indentLevel >= 4) className = "indent-2";
                        else if (indentLevel >= 2) className = "indent-1";
                        
                        const text = line.trim().replace(/^[-*•👉📌🔎]\s?/, '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        return `<li class="${className}">${text}</li>`;
                    }).join('');

                    htmlContent += `
                        <div class="report-section">
                            <div class="section-title"><i data-lucide="bar-chart-2"></i> ${title}</div>
                            <ul>${listItems}</ul>
                        </div>`;
                });
                htmlContent += `</div>`;

                const summarySection = sections.find(s => s.includes('핵심 요약'));
                if (summarySection) {
                    const summaryItems = summarySection.split('\n').slice(1).filter(l => l.trim().length > 0);
                    htmlContent += `
                        <div class="px-6 pb-8">
                            <div class="summary-box">
                                <span class="summary-title"><i data-lucide="award" class="inline w-5 h-5 mr-1"></i> ** 핵심 요약 **</span>
                                <ul>${summaryItems.map(item => `<li>${item.replace(/^[-*]\s?/, '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</li>`).join('')}</ul>
                            </div>
                        </div>`;
                }

                const reportCard = document.createElement('div');
                reportCard.className = 'report-card fade-in-up mt-8';
                reportCard.innerHTML = `
                    <div class="bg-indigo-600 px-6 py-5 flex justify-between items-center text-white">
                        <div class="flex items-center gap-3">
                            <div class="bg-white/20 p-2 rounded-xl"><i data-lucide="bar-chart" class="w-5 h-5"></i></div>
                            <span class="font-extrabold text-xl tracking-tight">${query}</span>
                        </div>
                        <span class="text-[11px] font-mono opacity-80 bg-black/10 px-2 py-1 rounded-md">${new Date().toLocaleTimeString()}</span>
                    </div>
                    <div class="bg-slate-900 px-6 py-4 flex flex-wrap gap-y-4 gap-x-8 border-b border-slate-800">
                        <div class="flex flex-col min-w-[100px]"><span class="text-[10px] text-slate-500 uppercase font-black">현재 주가</span><span class="price-highlight text-indigo-400 text-lg">${meta.price}</span></div>
                        <div class="flex flex-col min-w-[80px]"><span class="text-[10px] text-slate-500 uppercase font-black">224일선</span><span class="text-sm font-bold text-slate-300 mt-1">${meta.sma224}</span></div>
                        <div class="flex flex-col min-w-[80px]"><span class="text-[10px] text-slate-500 uppercase font-black">Trend</span><span class="text-sm font-bold text-indigo-400 mt-1">${meta.trend}</span></div>
                        <div class="flex flex-col min-w-[80px]"><span class="text-[10px] text-slate-500 uppercase font-black">Timing</span><span class="text-sm font-bold text-emerald-400 mt-1">${meta.timing}</span></div>
                        <div class="flex flex-col flex-1 min-w-[150px]"><span class="text-[10px] text-slate-500 uppercase font-black">Risk Score</span><div class="flex items-center gap-3 mt-2"><div class="h-1.5 flex-1 bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500" style="width: ${meta.risk}%"></div></div><span class="text-xs font-bold text-slate-400">${meta.risk}%</span></div></div>
                    </div>
                    ${htmlContent}
                `;
                
                reportHistory.appendChild(reportCard);
                loadingState.classList.add('hidden');
                lucide.createIcons();
                userInput.value = '';
                setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 100);
            } catch (err) {
                loadingState.classList.add('hidden');
                showError(err.message);
            } finally {
                btnSend.disabled = false;
            }
        }

        btnSend.addEventListener('click', startAnalysis);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') startAnalysis(); });
        document.getElementById('btn-save-key').addEventListener('click', () => {
            const val = apiKeyInput.value.trim();
            if (val) {
                localStorage.setItem(STORAGE_KEY, val);
                updateApiStatus(true);
                saveStatus.classList.remove('hidden');
                setTimeout(() => { saveStatus.classList.add('hidden'); }, 2000);
            }
        });
    </script>
</body>
</html>
