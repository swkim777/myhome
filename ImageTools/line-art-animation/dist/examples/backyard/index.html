<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backyard · line-art-animation</title>
<style>
  html, body { margin: 0; height: 100%; background: #ebe8e2; }
  body { display: grid; place-items: center; }
  .card { position: relative; width: min(94vw, calc((100vh - 48px) * 2)); aspect-ratio: 2 / 1; border-radius: 16px; overflow: hidden; background: #fdfcf8;
          box-shadow: 0 0 0 1px rgba(40, 34, 26, .10), 0 18px 50px -18px rgba(40, 34, 26, .35); touch-action: none; }
  #stage, #stage svg { display: block; width: 100%; height: 100%; }
  #stage svg .pp { fill: var(--paper, #fdfdfc); }
  .hint { position: absolute; left: 18px; bottom: 12px; font: 12px/1.4 ui-serif, "Iowan Old Style", Georgia, serif;
          color: #1c1c1c; opacity: 0.48; pointer-events: none; transition: opacity .6s ease; }
  .hint.gone { opacity: 0; }
  .gif-btn { position: absolute; top: 14px; right: 16px; z-index: 10; display: inline-flex; align-items: center; gap: 7px;
             padding: 6px 13px; border-radius: 999px; border: 1px solid rgba(28, 28, 28, .22);
             background: rgba(253, 252, 248, .88); backdrop-filter: blur(4px); color: #1c1c1c;
             font: 600 12.5px/1.2 -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
             cursor: pointer; box-shadow: 0 2px 8px rgba(28, 28, 28, .08); transition: all .18s ease; user-select: none; }
  .gif-btn:hover { background: #fdfcf8; border-color: rgba(28, 28, 28, .45); transform: translateY(-1px); }
  .gif-btn:disabled { opacity: 0.72; cursor: wait; transform: none; }
  .gif-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: #c84b31; transition: transform .2s ease; }
  .gif-btn.recording { border-color: #c84b31; background: #fff7f5; color: #9e2a17; }
  .gif-btn.recording .dot { border-radius: 2px; animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.88); } }
</style>
  <script type="module" crossorigin src="../../assets/backyard-0IibQlXC.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/ink-Br_ZpxCx.js">
  <link rel="modulepreload" crossorigin href="../../assets/motion-Oz34IgHU.js">
</head>
<body>
  <div class="card">
    <div id="stage"></div>
    <button id="gif-btn" class="gif-btn" type="button" title="클릭한 시점부터 원하는 장면을 GIF로 실시간 녹화하고 다운로드합니다">
      <span class="dot"></span>
      <span id="gif-label">GIF 녹화</span>
    </button>
    <div id="hint" class="hint">Click house to call owner · click pond or yard to guide butterfly · click a cat to pounce</div>
  </div>
</body>
</html>
