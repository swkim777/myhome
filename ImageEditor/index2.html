<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI 사진 편집기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4F46E5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .preview-container img {
            max-height: 500px;
            object-fit: contain;
        }
        .prompt-pill {
            transition: all 0.2s ease;
        }
        .prompt-pill:hover {
            transform: translateY(-2px);
        }
        .menu-animation {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">

    <div class="max-w-6xl mx-auto px-4 py-8 md:py-12">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-indigo-600 mb-2 flex items-center justify-center gap-3">
                <i class="fas fa-wand-magic-sparkles"></i>
                Gemini Photo Editor
            </h1>
            <p class="text-slate-500">AI를 사용하여 사진을 마법처럼 변형해 보세요</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Panel: Controls -->
            <div class="lg:col-span-1 flex flex-col gap-6">
                <!-- Upload Section -->
                <div class="glass-morphism p-6 rounded-3xl shadow-xl">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-image"></i> 이미지 업로드
                    </h2>
                    <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center hover:border-indigo-400 transition-colors cursor-pointer bg-white">
                        <input type="file" id="image-input" class="hidden" accept="image/*">
                        <i class="fas fa-cloud-upload-alt text-4xl text-slate-300 mb-3"></i>
                        <p class="text-sm text-slate-500">클릭하거나 파일을 드래그하여 업로드하세요</p>
                    </div>
                </div>

                <!-- Prompt Section -->
                <div class="glass-morphism p-6 rounded-3xl shadow-xl">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-bold flex items-center gap-2">
                            <i class="fas fa-comment-dots"></i> 편집 요청
                        </h2>
                        <button id="back-to-main" class="hidden text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 bg-indigo-50 px-2 py-1 rounded-md transition-colors">
                            <i class="fas fa-arrow-left"></i> 뒤로가기
                        </button>
                    </div>
                    
                    <!-- Prompt Recommendation Buttons -->
                    <div class="mb-4">
                        <p id="suggestion-title" class="text-xs font-semibold text-slate-400 uppercase mb-3 tracking-widest">추천 프롬프트 모드</p>
                        <div id="prompt-suggestions" class="flex flex-wrap gap-2">
                            <!-- Buttons will be generated by JS -->
                        </div>
                    </div>

                    <textarea id="prompt-input" rows="5" 
                        class="w-full p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none resize-none mb-4 text-sm"
                        placeholder="모드 버튼을 누르거나 직접 입력하세요..."></textarea>
                    
                    <button id="edit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
                        <span>AI 편집 시작</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- Right Panel: Results -->
            <div class="lg:col-span-2 flex flex-col gap-6">
                <div class="glass-morphism p-6 rounded-3xl shadow-xl min-h-[400px] flex flex-col">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold">편집 결과</h2>
                        <div id="status-badge" class="hidden px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-semibold">편집 중...</div>
                    </div>

                    <div id="preview-area" class="flex-grow flex flex-col items-center justify-center relative bg-slate-100 rounded-2xl overflow-hidden border border-slate-200">
                        <div id="empty-state" class="text-center p-10">
                            <div class="bg-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                                <i class="far fa-images text-3xl text-slate-300"></i>
                            </div>
                            <p class="text-slate-500">사진을 업로드하면 이곳에 표시됩니다</p>
                        </div>

                        <!-- Main Display -->
                        <div id="main-display" class="hidden w-full h-full flex flex-col md:flex-row gap-4 p-4">
                            <div class="flex-1 flex flex-col items-center">
                                <span class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">원본 이미지</span>
                                <div class="preview-container w-full h-full flex items-center justify-center">
                                    <img id="original-preview" class="rounded-lg shadow-md max-w-full">
                                </div>
                            </div>
                            <div class="flex-1 flex flex-col items-center border-t md:border-t-0 md:border-l border-slate-200 pt-4 md:pt-0 md:pl-4">
                                <span class="text-xs font-bold text-indigo-500 mb-2 uppercase tracking-wider">AI 편집 이미지</span>
                                <div class="preview-container w-full h-full flex items-center justify-center relative">
                                    <div id="loader" class="absolute inset-0 hidden flex-col items-center justify-center bg-white bg-opacity-80 z-10">
                                        <div class="loading-spinner mb-3"></div>
                                        <p class="text-sm font-medium text-slate-600 text-center px-4">Gemini가 이미지를 마법처럼 바꾸고 있습니다...</p>
                                    </div>
                                    <img id="edited-preview" class="rounded-lg shadow-md max-w-full hidden">
                                    <div id="edit-placeholder" class="w-full h-64 bg-slate-200 rounded-lg flex items-center justify-center">
                                        <p class="text-slate-400 text-sm">프롬프트를 입력하세요</p>
                                    </div>
                                </div>
                                <div id="action-buttons" class="hidden mt-4 flex gap-2">
                                    <button id="download-btn" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm flex items-center gap-2 hover:bg-slate-700">
                                        <i class="fas fa-download"></i> 다운로드
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div id="error-toast" class="fixed bottom-5 right-5 bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 transition-transform duration-300 flex items-center gap-3">
        <i class="fas fa-exclamation-circle"></i>
        <span id="error-message">오류가 발생했습니다.</span>
    </div>

    <script>
        const apiKey = ""; 
        const imageInput = document.getElementById('image-input');
        const dropZone = document.getElementById('drop-zone');
        const promptInput = document.getElementById('prompt-input');
        const editBtn = document.getElementById('edit-btn');
        const originalPreview = document.getElementById('original-preview');
        const editedPreview = document.getElementById('edited-preview');
        const emptyState = document.getElementById('empty-state');
        const mainDisplay = document.getElementById('main-display');
        const loader = document.getElementById('loader');
        const editPlaceholder = document.getElementById('edit-placeholder');
        const actionButtons = document.getElementById('action-buttons');
        const statusBadge = document.getElementById('status-badge');
        const errorToast = document.getElementById('error-toast');
        const errorMessage = document.getElementById('error-message');
        const downloadBtn = document.getElementById('download-btn');
        const promptSuggestions = document.getElementById('prompt-suggestions');
        const suggestionTitle = document.getElementById('suggestion-title');
        const backBtn = document.getElementById('back-to-main');

        let currentBase64Image = null;

        // 메인 카테고리 데이터
        const mainModes = [
            { id: 'bg', title: "🖼️ 배경 변환", detail: "배경 변환 모드" },
            { id: 'style', title: "🎨 화풍 변환", detail: "화풍 변환 모드" },
            { id: 'acc', title: "🕶️ 액세서리", detail: "인물에게 세련된 선글라스나 모자 액세서리를 추가해줘." },
            { id: 'season', title: "❄️ 계절 변경", detail: "배경을 눈 내리는 겨울 또는 단풍 핀 가을로 바꿔줘." },
            { id: 'body', title: "💇 신체 변화", detail: "머리카락 색상을 바꾸거나 스타일을 자연스럽게 보정해줘." },
            { id: 'animal', title: "🐱 동물 편집", detail: "사진 속에 귀여운 동물을 추가하거나 종류를 변경해줘." },
            { id: 'outfit', title: "👕 의상 교체", detail: "현재 의상을 정장이나 다른 스타일로 자연스럽게 갈아입혀줘." },
            { id: 'person', title: "🚶 인물 교체", detail: "인물의 표정을 웃게 만들거나 다른 느낌의 인물로 변경해줘." },
            { id: 'camera', title: "📸 카메라 위치", detail: "앵글을 하이 앵글이나 시네마틱한 광각 효과로 바꿔줘." },
            { id: 'lighting', title: "✨ 조명 & 분위기", detail: "몽환적인 조명이나 따스한 햇살 분위기를 추가해줘." }
        ];

        // 배경 변환 세부 예시 데이터 (10개)
        const bgSubModes = [
            { title: "🗼 파리 에펠탑", detail: "사진의 배경을 낭만적인 파리 에펠탑이 보이는 광장으로 자연스럽게 바꿔줘." },
            { title: "🌃 뉴욕 타임스퀘어", detail: "화려한 전광판과 도시의 활기가 가득한 밤의 뉴욕 타임스퀘어 배경으로 변경해줘." },
            { title: "🏝️ 에메랄드 해변", detail: "투명한 에메랄드빛 바다와 하얀 모래사장, 야자수가 있는 휴양지 배경으로 바꿔줘." },
            { title: "📚 고풍스러운 서재", detail: "벽면 가득 책이 꽂혀 있고 따뜻한 조명이 흐르는 조용한 서재 배경으로 변환해줘." },
            { title: "🏯 경복궁 근정전", detail: "한국의 전통미가 느껴지는 고즈넉한 경복궁 근정전 앞마당 배경으로 바꿔줘." },
            { title: "🌌 신비로운 우주", detail: "거대한 성운과 은하수가 반짝이는 웅장하고 신비로운 우주 공간으로 배경을 변경해줘." },
            { title: "🏔️ 만년설 산맥", detail: "구름 위에 솟아오른 웅장한 만년설 덮인 설산과 맑은 호수가 있는 배경으로 바꿔줘." },
            { title: "🪐 화성 탐사선", detail: "붉은 먼지가 날리고 지구와 탐사선이 보이는 미래적인 화성 표면 배경으로 변경해줘." },
            { title: "🏠 모던 거실", detail: "세련된 가구와 통창 너머로 숲이 보이는 현대적인 인테리어의 거실 배경으로 바꿔줘." },
            { title: "🧜 심해 속 세상", detail: "산호초와 형형색색의 물고기들이 헤엄치는 푸른 심해 속 바다 세계 배경으로 변경해줘." }
        ];

        // 화풍 변환 세부 예시 데이터 (10개)
        const styleSubModes = [
            { title: "🌻 고흐 유화", detail: "이 이미지를 빈센트 반 고흐의 '해바라기'와 같은 강렬한 질감의 유화 스타일로 변환해줘." },
            { title: "🌊 모네 인상주의", detail: "클로드 모네의 화풍처럼 부드러운 색감과 빛의 변화가 느껴지는 인상주의 스타일로 바꿔줘." },
            { title: "⚡ 사이버펑크", detail: "네온 조명과 어두운 배경이 조화된 미래적인 사이버펑크 디지털 아트 스타일로 변형해줘." },
            { title: "🎨 팝 아트", detail: "앤디 워홀의 작품처럼 선명한 대비와 화려한 원색을 사용하는 현대적인 팝 아트 스타일로 변환해줘." },
            { title: "🖌️ 수채화", detail: "물감이 맑게 번진 듯한 감성적이고 투명한 느낌의 수채화 스타일로 사진을 그려줘." },
            { title: "👾 픽셀 아트", detail: "고전 레트로 게임 느낌이 나도록 낮은 해상도의 정교한 픽셀 아트 스타일로 변환해줘." },
            { title: "✏️ 연필 스케치", detail: "세밀한 선으로 정교하게 묘사된 흑백 연필 데생 스케치 스타일로 바꿔줘." },
            { title: "🎥 3D 애니메이션", detail: "디즈니나 픽사 영화의 캐릭터처럼 부드럽고 입체적인 3D 애니메이션 스타일로 변형해줘." },
            { title: "🧧 수묵화", detail: "전통적인 동양의 수묵화처럼 여백의 미와 먹의 번짐이 살아있는 스타일로 그려줘." },
            { title: "🦄 판타지 일러스트", detail: "신비롭고 몽환적인 분위기가 가득한 동화 속 판타지 일러스트 화풍으로 변환해줘." }
        ];

        // 버튼 렌더링 함수
        function renderModes(modes, modeId = null) {
            promptSuggestions.innerHTML = '';
            promptSuggestions.classList.add('menu-animation');
            
            if (modeId === 'bg') {
                suggestionTitle.textContent = "배경 변환 상세 예시";
                backBtn.classList.remove('hidden');
            } else if (modeId === 'style') {
                suggestionTitle.textContent = "화풍 변환 상세 예시";
                backBtn.classList.remove('hidden');
            } else {
                suggestionTitle.textContent = "추천 프롬프트 모드";
                backBtn.classList.add('hidden');
            }

            modes.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'prompt-pill px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-600 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-600 shadow-sm';
                btn.textContent = item.title;
                btn.onclick = () => {
                    if (item.id === 'bg') {
                        renderModes(bgSubModes, 'bg');
                    } else if (item.id === 'style') {
                        renderModes(styleSubModes, 'style');
                    } else {
                        promptInput.value = item.detail;
                        promptInput.focus();
                    }
                };
                promptSuggestions.appendChild(btn);
            });
            
            // 애니메이션 제거용
            setTimeout(() => promptSuggestions.classList.remove('menu-animation'), 300);
        }

        // 뒤로가기 버튼 이벤트
        backBtn.onclick = () => renderModes(mainModes);

        // 초기 렌더링
        renderModes(mainModes);

        // 드래그 앤 드롭 핸들러
        dropZone.addEventListener('click', () => imageInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-400', 'bg-indigo-50');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-400', 'bg-indigo-50');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-400', 'bg-indigo-50');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentBase64Image = e.target.result.split(',')[1];
                originalPreview.src = e.target.result;
                emptyState.classList.add('hidden');
                mainDisplay.classList.remove('hidden');
                editedPreview.classList.add('hidden');
                editPlaceholder.classList.remove('hidden');
                actionButtons.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorToast.classList.remove('translate-y-20');
            setTimeout(() => {
                errorToast.classList.add('translate-y-20');
            }, 5000);
        }

        async function editImage() {
            const prompt = promptInput.value.trim();
            if (!currentBase64Image) return showError("먼저 이미지를 업로드해주세요.");
            if (!prompt) return showError("편집 요청 내용을 입력하거나 모드를 선택해주세요.");

            loader.classList.remove('hidden');
            editPlaceholder.classList.add('hidden');
            editedPreview.classList.add('hidden');
            actionButtons.classList.add('hidden');
            statusBadge.classList.remove('hidden');
            editBtn.disabled = true;
            editBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const payload = {
                contents: [{
                    parts: [
                        { text: `수정 요청 사항: ${prompt}. 원본 이미지의 피사체 특징을 잘 유지하면서 요청한 배경이나 스타일을 자연스럽게 반영해줘. 고해상도로 생성해.` },
                        { inlineData: { mimeType: "image/png", data: currentBase64Image } }
                    ]
                }],
                generationConfig: {
                    responseModalities: ["TEXT", "IMAGE"]
                }
            };

            let retries = 0;
            const maxRetries = 5;

            async function makeRequest() {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || 'API 요청 실패');
                    }

                    const data = await response.json();
                    const imagePart = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                    
                    if (imagePart) {
                        const editedBase64 = `data:image/png;base64,${imagePart.inlineData.data}`;
                        editedPreview.src = editedBase64;
                        editedPreview.classList.remove('hidden');
                        actionButtons.classList.remove('hidden');
                        
                        downloadBtn.onclick = () => {
                            const link = document.createElement('a');
                            link.href = editedBase64;
                            link.download = `gemini_edited_${Date.now()}.png`;
                            link.click();
                        };
                    } else {
                        throw new Error('응답에서 이미지를 생성하지 못했습니다.');
                    }
                } catch (error) {
                    if (retries < maxRetries) {
                        retries++;
                        const delay = Math.pow(2, retries) * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return makeRequest();
                    }
                    throw error;
                }
            }

            try {
                await makeRequest();
            } catch (error) {
                console.error(error);
                showError("편집 중 오류: " + error.message);
                editPlaceholder.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                statusBadge.classList.add('hidden');
                editBtn.disabled = false;
                editBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        editBtn.addEventListener('click', editImage);
    </script>
</body>
</html>
