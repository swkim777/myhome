<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동영상 다중 프레임 추출기</title>
    <!-- Tailwind CSS CDN 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Inter 폰트 적용 및 기본 배경 설정 */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        /* 숨겨진 요소들 */
        #video-preview, #canvas-extractor {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-4xl bg-white shadow-xl rounded-xl p-8 space-y-8">

        <h1 class="text-3xl font-bold text-gray-800 text-center border-b pb-4">
            🎥 동영상 시점별 이미지 추출기
        </h1>

        <!-- 1. 파일 업로드 영역 -->
        <div class="p-6 bg-indigo-50 border border-indigo-200 rounded-lg space-y-4">
            <label for="video-file" class="block text-lg font-medium text-indigo-800">
                1단계: 동영상 파일 업로드
            </label>
            <input type="file" id="video-file" accept="video/*" 
                   class="block w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer"/>
            
            <p id="status-message" class="text-sm text-gray-600 mt-2">파일을 선택하면 추출 버튼이 활성화됩니다.</p>
        </div>

        <!-- 2. 추출 시점 선택 영역 -->
        <div class="p-6 bg-slate-50 border border-slate-200 rounded-lg space-y-4">
            <h2 class="text-xl font-semibold text-gray-800">
                2단계: 추출할 시점 선택
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button id="btn-start" disabled
                        class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition duration-300 disabled:opacity-40 disabled:cursor-not-allowed">
                    시작 화면 (0s)
                </button>
                <button id="btn-middle" disabled
                        class="px-6 py-3 bg-purple-600 text-white font-semibold rounded-lg shadow-md hover:bg-purple-700 transition duration-300 disabled:opacity-40 disabled:cursor-not-allowed">
                    중간 화면
                </button>
                <button id="btn-end" disabled
                        class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-300 disabled:opacity-40 disabled:cursor-not-allowed">
                    마지막 화면
                </button>
            </div>
        </div>

        <!-- 3. 추출 결과 영역 -->
        <div class="p-6 bg-white border border-gray-200 rounded-lg space-y-4">
            <h2 class="text-xl font-semibold text-gray-800">
                3단계: 추출 결과 확인 및 저장
            </h2>
            
            <div id="image-container" class="min-h-[300px] flex justify-center items-center bg-gray-100 rounded-lg border-2 border-dashed border-gray-300 overflow-hidden relative">
                <span id="placeholder-text" class="text-gray-500">
                    상단의 버튼을 눌러 이미지를 추출하세요.
                </span>
                <!-- 로딩 스피너 (추출 중 표시) -->
                <div id="loader" class="hidden absolute inset-0 flex items-center justify-center bg-white bg-opacity-80">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
                </div>
                <img id="extracted-image" src="" alt="추출된 프레임" class="max-w-full max-h-[500px] hidden rounded-lg shadow-lg object-contain">
            </div>

            <div class="flex justify-center">
                <button id="download-button" disabled
                        class="w-full sm:w-auto px-10 py-3 bg-green-600 text-white font-bold rounded-lg shadow-lg hover:bg-green-700 transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    현재 이미지 다운로드
                </button>
            </div>
        </div>
        
        <!-- 처리용 숨김 요소 -->
        <video id="video-preview" preload="metadata"></video>
        <canvas id="canvas-extractor"></canvas>

    </div>

    <script>
        const fileInput = document.getElementById('video-file');
        const btnStart = document.getElementById('btn-start');
        const btnMiddle = document.getElementById('btn-middle');
        const btnEnd = document.getElementById('btn-end');
        const downloadButton = document.getElementById('download-button');
        
        const videoElement = document.getElementById('video-preview');
        const canvas = document.getElementById('canvas-extractor');
        const ctx = canvas.getContext('2d');
        const extractedImage = document.getElementById('extracted-image');
        const placeholderText = document.getElementById('placeholder-text');
        const statusMessage = document.getElementById('status-message');
        const loader = document.getElementById('loader');

        let extractedImageUrl = '';
        let baseFileName = 'video_frame';
        let currentTarget = ''; // start, middle, end 중 무엇인지 기록

        // 파일 선택 이벤트
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                // 기존 비디오 소스 정리
                if (videoElement.src) URL.revokeObjectURL(videoElement.src);
                
                videoElement.src = URL.createObjectURL(file);
                baseFileName = file.name.split('.').slice(0, -1).join('.');
                statusMessage.textContent = `📂 로드됨: ${file.name} (파일 분석 중...)`;

                // 메타데이터 로드 대기
                videoElement.onloadedmetadata = () => {
                    btnStart.disabled = false;
                    btnMiddle.disabled = false;
                    btnEnd.disabled = false;
                    statusMessage.textContent = `✅ 준비 완료! 동영상 길이: ${videoElement.duration.toFixed(2)}초`;
                };
            }
        });

        // 공통 추출 함수
        function startExtraction(type) {
            if (!videoElement.src) return;

            currentTarget = type;
            let seekTime = 0;

            if (type === 'start') {
                seekTime = 0;
            } else if (type === 'middle') {
                seekTime = videoElement.duration / 2;
            } else if (type === 'end') {
                seekTime = Math.max(0, videoElement.duration - 0.1);
            }

            // UI 상태 변경
            loader.classList.remove('hidden');
            placeholderText.classList.add('hidden');
            extractedImage.classList.add('hidden');
            downloadButton.disabled = true;
            statusMessage.textContent = `⏳ ${type} 시점(${seekTime.toFixed(2)}s)의 프레임을 가져오는 중...`;

            videoElement.currentTime = seekTime;
        }

        // 프레임 이동 완료 시 캔버스 캡처
        videoElement.onseeked = () => {
            canvas.width = videoElement.videoWidth;
            canvas.height = videoElement.videoHeight;
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            extractedImageUrl = canvas.toDataURL('image/png');
            extractedImage.src = extractedImageUrl;
            
            extractedImage.classList.remove('hidden');
            loader.classList.add('hidden');
            downloadButton.disabled = false;
            statusMessage.textContent = `🎉 추출 성공: ${currentTarget} 프레임`;
        };

        // 버튼 클릭 리스너 연결
        btnStart.addEventListener('click', () => startExtraction('start'));
        btnMiddle.addEventListener('click', () => startExtraction('middle'));
        btnEnd.addEventListener('click', () => startExtraction('end'));

        // 다운로드 로직
        downloadButton.addEventListener('click', () => {
            if (!extractedImageUrl) return;

            const link = document.createElement('a');
            link.href = extractedImageUrl;
            link.download = `${baseFileName}_${currentTarget}_frame.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            statusMessage.textContent = `⬇️ 저장 완료: ${baseFileName}_${currentTarget}_frame.png`;
        });

        // 비디오 로드 에러 처리
        videoElement.onerror = () => {
            statusMessage.textContent = '❌ 동영상을 불러올 수 없습니다. 지원하지 않는 형식이거나 파일이 손상되었습니다.';
            loader.classList.add('hidden');
        };
    </script>
</body>
</html>
