<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>시작되는 봄, 사이버펑크 도시의 파수꾼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-amber-50/40 text-slate-800 font-['Noto_Sans_KR'] p-6 md:p-12">
    <div class="max-w-3xl mx-auto bg-white p-8 md:p-12 rounded-2xl shadow-sm border border-amber-100 space-y-6">
        <a href="index.html" class="text-xs font-bold text-amber-700 hover:underline">&larr; novel 카테고리로 돌아가기</a>
        <div class="flex items-center space-x-2">
            <span class="text-xs font-bold px-3 py-1 bg-amber-100 text-amber-800 rounded-full">Novel</span>
            <span class="text-xs text-slate-400">2026.09.24</span>
        </div>
        <h1 class="font-['Song_Myung'] text-3xl font-bold text-slate-900 leading-tight">시작되는 봄, 사이버펑크 도시의 파수꾼</h1>
        <p class="text-slate-600 text-lg leading-relaxed border-l-4 border-amber-500 pl-4 bg-amber-50/50 py-2 italic font-['Song_Myung']">
            "비가 내리는 2099년의 도시. 홀로그램 간판 아래에서 그는 오래된 종이책 한 권을 펼쳐 들었다."
        </p>
        <div class="prose max-w-none text-slate-700 leading-relaxed space-y-4 pt-4 border-t border-slate-100 font-serif">
            <p>네온빛으로 물든 인공 기후 도시 '신서울'의 밤. 끊임없이 흘러내리는 빗줄기 사이로 구식 트렌치코트를 입은 남자가 걸어가고 있었다.</p>
            <p>그의 품속에 자리 잡은 것은 디지털 데이터 스크린이 아닌, 바래진 종이 향기가 짙게 배어 있는 문학 서적이었다.</p>
        </div>
    </div>
