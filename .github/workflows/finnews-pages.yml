name: Deploy FinNews to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build FinNews
        working-directory: ./FinNews
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm ci
          npm run build
          rm -rf ../FinNewsBuild
          mkdir -p ../FinNewsBuild
          cp -R dist/* ../FinNewsBuild/

      - name: Prepare site root
        run: |
          rm -rf ./FinNews
          mkdir -p ./FinNews
          cp -R ./FinNewsBuild/* ./FinNews/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4