<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jowon Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #06b6d4;
            --dark-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at top left, #1e293b, var(--dark-bg) 40%);
            overscroll-behavior-y: none;
        }
        /* Custom styles for Range inputs (Sliders) */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--cyan);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(6, 182, 212, 0.5);
        }
        /* Custom styles for Scrollbar */
        #playlist-container::-webkit-scrollbar { width: 6px; }
        #playlist-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        #playlist-container::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body onload="new MusicPlayerApp().init();">
    <div id="app" class="flex items-center justify-center min-h-screen">
        <!-- Application container will be rendered here by JavaScript -->
    </div>

    <!-- The actual audio element is hidden at the bottom -->
    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        // ============== Utility Functions and Constants ================

        const RepeatMode = { NONE: 0, ONE: 1, ALL: 2 };
        const eqFrequencies = [60, 170, 310, 600, 1000, 3000, 6000, 12000];
        const visualizerModes = ['line', 'bars', 'wave', 'circle', 'dots'];

        /**
         * 시간을 'M:SS' 형식의 문자열로 포맷합니다.
         * @param {number} seconds
         * @returns {string}
         */
        const formatTime = (seconds) => {
            if (isNaN(seconds) || seconds < 0) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;
        };

        /**
         * SVG 아이콘을 반환합니다. (Lucide-React 아이콘을 단순화한 버전)
         * @param {string} name - 아이콘 이름
         * @param {string} className - Tailwind CSS 클래스
         * @returns {string}
         */
        const getIconSvg = (name, className = 'w-6 h-6') => {
            const icons = {
                'trash': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M14 6V4c0-1-1-2-2-2h-4c-1 0-2 1-2 2v2"/></svg>`,
                'sort': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h10"/></svg>`,
                'music-note': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><path d="M22 17c0 1.1-2 2-2 2s-2-.9-2-2 2-2 2-2 2 .9 2 2z"/><path d="M7 19c0 1.1-2 2-2 2s-2-.9-2-2 2-2 2-2 2 .9 2 2z"/></svg>`,
                'prev': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>`,
                'play': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
                'pause': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
                'next': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>`,
                'volume': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`,
                'folder': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 4.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/></svg>`,
                'gallery': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>`,
                'chart-bar': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-8"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>`,
                'equalizer': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V4"/><path d="M12 20V8"/><path d="M19 20v-8"/></svg>`,
                'list': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3" y2="6"/><line x1="3" y1="12" x2="3" y2="12"/><line x1="3" y1="18" x2="3" y2="18"/></svg>`,
                'search': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
                'refresh': `<svg xmlns="http://www.w3.org/2000/svg" class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M21 13a9 9 0 0 0-7-7.94"/><path d="M3 11a9 9 0 0 1 7 7.94"/></svg>`
            };
            return icons[name] || '';
        };

        // ============== Visualizer Class ================

        class Visualizer {
            /**
             * @param {HTMLElement} containerElement
             */
            constructor(containerElement) {
                this.container = containerElement;
                this.canvas = document.createElement('canvas');
                this.canvas.className = 'w-full h-full';
                this.ctx = this.canvas.getContext('2d');
                this.container.appendChild(this.canvas);

                this.mode = visualizerModes[0]; // 'line'
                this.analyser = null;
                this.dataArray = null;
                this.bufferLength = 0;
                this.animationFrameId = null;

                window.addEventListener('resize', this.onResize.bind(this));
                this.onResize();
            }

            setAnalyser(analyser) {
                this.analyser = analyser;
                this.analyser.fftSize = 2048;
                this.bufferLength = this.analyser.frequencyBinCount;
                this.dataArray = new Uint8Array(this.bufferLength);
            }
            
            setMode(index) {
                this.mode = visualizerModes[index % visualizerModes.length];
            }

            onResize() {
                this.canvas.width = this.container.clientWidth;
                this.canvas.height = this.container.clientHeight;
            }

            start() {
                if (this.animationFrameId) this.stop();
                this.draw();
            }

            stop() {
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                    this.animationFrameId = null;
                    this.clearCanvas();
                }
            }

            clearCanvas() {
                 this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            draw() {
                this.animationFrameId = requestAnimationFrame(this.draw.bind(this));
                if (!this.analyser || !this.dataArray) {
                     this.clearCanvas();
                     return;
                }

                const { ctx, canvas, analyser, dataArray, bufferLength, mode } = this;
                const width = canvas.width;
                const height = canvas.height;
                const centerH = height / 2;
                
                analyser.getByteTimeDomainData(dataArray); // Time domain for wave
                analyser.getByteFrequencyData(dataArray); // Frequency domain for bars/dots/circle

                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, width, height);
                ctx.lineWidth = 2;
                ctx.strokeStyle = `hsl(${Math.random() * 360}, 70%, 50%)`; // Dynamic color for fun

                switch (mode) {
                    case 'wave':
                        analyser.getByteTimeDomainData(dataArray);
                        ctx.strokeStyle = 'rgba(6, 182, 212, 0.7)';
                        ctx.beginPath();
                        const sliceWidth = width * 1.0 / bufferLength;
                        let x = 0;
                        for(let i = 0; i < bufferLength; i++) {
                            const v = dataArray[i] / 128.0;
                            const y = v * centerH;
                            if(i === 0) {
                                ctx.moveTo(x, y);
                            } else {
                                ctx.lineTo(x, y);
                            }
                            x += sliceWidth;
                        }
                        ctx.lineTo(width, centerH);
                        ctx.stroke();
                        break;
                    case 'bars':
                        const barWidth = (width / bufferLength) * 2.5;
                        let barX = 0;
                        for(let i = 0; i < bufferLength; i++) {
                            const barHeight = dataArray[i] / 2;
                            ctx.fillStyle = `rgb(${barHeight + 100}, 50, 100)`;
                            ctx.fillRect(barX, height - barHeight, barWidth, barHeight);
                            barX += barWidth + 1;
                        }
                        break;
                    case 'circle':
                    case 'dots':
                        const radius = Math.min(width, height) / 3;
                        const numDots = 64;
                        const step = Math.PI * 2 / numDots;
                        
                        ctx.translate(width / 2, height / 2);

                        for (let i = 0; i < numDots; i++) {
                            const magnitude = dataArray[i] / 255;
                            const dotRadius = magnitude * 10;
                            const currentRadius = radius + magnitude * 50;
                            const angle = i * step;
                            const x = currentRadius * Math.cos(angle);
                            const y = currentRadius * Math.sin(angle);
                            
                            ctx.fillStyle = `hsla(${i * 5}, 70%, 60%, 0.8)`;
                            ctx.beginPath();
                            ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.translate(-width / 2, -height / 2);
                        break;
                    case 'line':
                    default:
                        analyser.getByteTimeDomainData(dataArray);
                        ctx.strokeStyle = 'rgba(6, 182, 212, 0.7)';
                        ctx.beginPath();
                        const sliceWidthLine = width * 1.0 / bufferLength;
                        let xLine = 0;
                        for(let i = 0; i < bufferLength; i++) {
                            const v = dataArray[i] / 128.0;
                            const y = v * centerH;
                            if(i === 0) {
                                ctx.moveTo(xLine, y);
                            } else {
                                ctx.lineTo(xLine, y);
                            }
                            xLine += sliceWidthLine;
                        }
                        ctx.stroke();
                        break;
                }
            }
        }

        // ============== Equalizer Class/Modal (Simplified) ================

        class EqualizerModal {
            /**
             * @param {MusicPlayerApp} app - MusicPlayerApp 인스턴스
             */
            constructor(app) {
                this.app = app;
                this.modalElement = null;
                this.isVisible = false;
                this.frequencies = eqFrequencies;
            }

            render() {
                if (this.modalElement) return;

                const modalHtml = `
                    <div id="eq-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
                        <div class="bg-gray-800/95 p-6 rounded-xl shadow-2xl w-96 border border-gray-700">
                            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                                <h3 class="text-lg font-bold text-cyan-400">오디오 이퀄라이저</h3>
                                <button onclick="window.playerApp.equalizerModal.close()" class="text-gray-400 hover:text-white p-1 rounded-full">&times;</button>
                            </div>
                            <div id="eq-sliders" class="grid grid-cols-4 gap-4">
                                <!-- Sliders will be injected here -->
                            </div>
                            <div class="mt-4 text-xs text-gray-400 text-center">게인 범위: -12dB ~ +12dB</div>
                        </div>
                    </div>
                `;
                this.modalElement = document.createElement('div');
                this.modalElement.innerHTML = modalHtml;
                document.body.appendChild(this.modalElement);
                this.renderSliders();
            }

            renderSliders() {
                const sliderContainer = this.modalElement.querySelector('#eq-sliders');
                if (!sliderContainer) return;

                sliderContainer.innerHTML = this.frequencies.map((freq, i) => `
                    <div class="flex flex-col items-center">
                        <input type="range" min="-12" max="12" step="0.1" value="${this.app.state.eqGains[i]}"
                               data-index="${i}" oninput="window.playerApp.handleEqGainChange(this)"
                               class="w-full h-24 transform rotate-[-90deg] origin-center appearance-none bg-gray-700/50 rounded-lg accent-cyan-400 cursor-pointer"
                        />
                        <span class="mt-8 text-xs text-gray-300">${freq < 1000 ? freq + 'Hz' : freq / 1000 + 'kHz'}</span>
                        <span id="gain-value-${i}" class="text-sm font-mono text-cyan-300 mt-1">${this.app.state.eqGains[i].toFixed(1)} dB</span>
                    </div>
                `).join('');
            }
            
            updateSliders(newGains) {
                newGains.forEach((gain, i) => {
                    const input = this.modalElement.querySelector(`input[data-index="${i}"]`);
                    const valueSpan = this.modalElement.querySelector(`#gain-value-${i}`);
                    if (input) input.value = gain;
                    if (valueSpan) valueSpan.textContent = `${gain.toFixed(1)} dB`;
                });
            }

            open() {
                this.render(); // Ensure the element exists
                this.modalElement.style.display = 'flex';
                this.isVisible = true;
            }

            close() {
                if (this.modalElement) {
                    this.modalElement.style.display = 'none';
                }
                this.isVisible = false;
            }
        }

        // ============== Main Application Class ================

        class MusicPlayerApp {
            constructor() {
                this.state = {
                    playlist: [],
                    currentTrackIndex: null,
                    isPlaying: false,
                    currentTime: 0,
                    duration: 0,
                    volume: 0.5,
                    repeatMode: RepeatMode.NONE,
                    isShuffled: false,
                    searchTerm: "",
                    isSidebarVisible: true,
                    showVisualizer: true,
                    visualizerModeIndex: 0,
                    selectedTrackIds: new Set(),
                    isEqVisible: false,
                    eqGains: Array(eqFrequencies.length).fill(0),
                    sortConfig: { key: 'name', direction: 'asc' },
                };

                this.audio = document.getElementById('audio-player');
                this.fileInput = document.createElement('input');
                this.fileInput.type = 'file';
                this.fileInput.multiple = true;
                this.fileInput.accept = 'audio/*';

                this.audioContext = null;
                this.analyserNode = null;
                this.eqFilters = [];
                this.visualizer = null;
                this.equalizerModal = new EqualizerModal(this);

                this.displayedPlaylist = [];
            }
            
            // --- State Management and Update ---
            
            setState(newState) {
                Object.assign(this.state, newState);
                this.updateDisplayedPlaylist();
                this.render();
                this.updateAudioControls();
                if (this.equalizerModal.isVisible) this.equalizerModal.updateSliders(this.state.eqGains);
            }
            
            updateDisplayedPlaylist() {
                this.displayedPlaylist = this.state.playlist
                    .filter(track =>
                        track.name.toLowerCase().includes(this.state.searchTerm.toLowerCase()) ||
                        track.artist.toLowerCase().includes(this.state.searchTerm.toLowerCase())
                    )
                    .sort((a, b) => {
                        const key = this.state.sortConfig.key;
                        const direction = this.state.sortConfig.direction === 'asc' ? 1 : -1;
                        const valA = a[key]?.toLowerCase() || '';
                        const valB = b[key]?.toLowerCase() || '';
                        if (valA < valB) return -1 * direction;
                        if (valA > valB) return 1 * direction;
                        return 0;
                    });
            }
            
            // --- Web Audio API Setup ---

            setupAudioContext() {
                if (this.audioContext && this.audioContext.state !== 'closed') {
                    // Start the context on user interaction if it's suspended
                    if (this.audioContext.state === 'suspended') {
                        this.audioContext.resume().catch(e => console.error("Error resuming AudioContext:", e));
                    }
                    return;
                }

                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Set up the source
                const source = this.audioContext.createMediaElementSource(this.audio);
                
                // Set up analyser for visualizer
                this.analyserNode = this.audioContext.createAnalyser();
                this.analyserNode.fftSize = 2048;

                // Set up EQ filters
                this.eqFilters = eqFrequencies.map((freq, i) => {
                    const filter = this.audioContext.createBiquadFilter();
                    filter.type = 'peaking';
                    filter.frequency.value = freq;
                    filter.gain.value = this.state.eqGains[i];
                    filter.Q.value = 1.4;
                    return filter;
                });

                // Connect the chain: Source -> Filters -> Analyser -> Destination
                let connectedNode = source;
                this.eqFilters.forEach(filter => {
                    connectedNode.connect(filter);
                    connectedNode = filter;
                });
                
                connectedNode.connect(this.analyserNode);
                this.analyserNode.connect(this.audioContext.destination);
                
                if (this.visualizer) {
                    this.visualizer.setAnalyser(this.analyserNode);
                    if (this.state.isPlaying) this.visualizer.start();
                }
            }
            
            updateAudioContextGains() {
                if (!this.eqFilters.length) return;
                this.eqFilters.forEach((filter, i) => {
                    filter.gain.value = this.state.eqGains[i];
                });
            }

            // --- Track Control Logic ---

            loadAndPlayTrack(index) {
                if (index === null || index < 0 || index >= this.state.playlist.length) {
                    this.audio.pause();
                    this.audio.src = '';
                    this.setState({ currentTrackIndex: null, isPlaying: false, currentTime: 0, duration: 0 });
                    this.visualizer?.stop();
                    return;
                }
                
                const track = this.state.playlist[index];
                if (this.audio.src !== track.url) {
                    this.audio.src = track.url;
                }
                
                this.setupAudioContext();

                this.audio.play().then(() => {
                    this.setState({ currentTrackIndex: index, isPlaying: true });
                    this.visualizer?.start();
                }).catch(e => console.error("Error playing audio:", e));
            }
            
            handlePlayPause() {
                if (this.state.playlist.length === 0) return;
                
                if (this.state.currentTrackIndex === null) {
                    this.loadAndPlayTrack(0);
                    return;
                }

                if (this.state.isPlaying) {
                    this.audio.pause();
                    this.setState({ isPlaying: false });
                    this.visualizer?.stop();
                } else {
                    this.loadAndPlayTrack(this.state.currentTrackIndex); // Will call play() inside
                }
            }

            handleNext() {
                if (this.state.playlist.length === 0 || this.state.currentTrackIndex === null) return;
                
                let nextIndex;
                if (this.state.isShuffled) {
                    nextIndex = Math.floor(Math.random() * this.state.playlist.length);
                } else {
                    nextIndex = this.state.currentTrackIndex + 1;
                    if (nextIndex >= this.state.playlist.length) {
                        if (this.state.repeatMode === RepeatMode.ALL) {
                            nextIndex = 0;
                        } else {
                            this.setState({ isPlaying: false });
                            this.visualizer?.stop();
                            return;
                        }
                    }
                }
                this.loadAndPlayTrack(nextIndex);
            }

            handlePrev() {
                if (this.state.playlist.length === 0 || this.state.currentTrackIndex === null) return;
                
                let prevIndex = this.state.currentTrackIndex - 1;
                if (prevIndex < 0) prevIndex = this.state.playlist.length - 1;
                this.loadAndPlayTrack(prevIndex);
            }
            
            handleSeek(input) {
                const newTime = parseFloat(input.value);
                this.audio.currentTime = newTime;
                this.setState({ currentTime: newTime });
            }
            
            handleVolumeChange(input) {
                const newVolume = parseFloat(input.value);
                this.audio.volume = newVolume;
                this.setState({ volume: newVolume });
            }
            
            handleEqGainChange(input) {
                const index = parseInt(input.dataset.index);
                const newGain = parseFloat(input.value);
                const newGains = [...this.state.eqGains];
                newGains[index] = newGain;
                this.setState({ eqGains: newGains });
                this.updateAudioContextGains();
            }

            // --- Playlist Management ---

            handleFileChange = async (event) => {
                const files = event.target.files;
                if (!files || files.length === 0) return;

                const trackPromises = Array.from(files).map((file, index) => {
                    return new Promise((resolve) => {
                        const url = URL.createObjectURL(file);
                        const audio = document.createElement('audio');
                        audio.preload = 'metadata';
                        audio.src = url;

                        const fileName = file.name.replace(/\.[^/.]+$/, "");
                        let artist = 'Unknown Artist';
                        let name = fileName;
                        
                        const parts = fileName.split(' - ');
                        if (parts.length > 1) {
                            artist = parts[0].trim();
                            name = parts.slice(1).join(' - ').trim();
                        }

                        audio.onloadedmetadata = () => {
                            resolve({ id: `${Date.now()}-${index}`, file, name, artist, duration: audio.duration, url });
                        };
                        audio.onerror = () => {
                             resolve({ id: `${Date.now()}-${index}`, file, name, artist, duration: 0, url });
                        };
                    });
                });

                const newTracks = await Promise.all(trackPromises);
                const wasEmpty = this.state.playlist.length === 0;
                
                const newPlaylist = [...this.state.playlist, ...newTracks];
                let newIndex = this.state.currentTrackIndex;

                if (wasEmpty && newTracks.length > 0) {
                    newIndex = 0;
                    this.setState({ playlist: newPlaylist, currentTrackIndex: newIndex, isPlaying: true });
                    this.loadAndPlayTrack(newIndex);
                } else {
                    this.setState({ playlist: newPlaylist });
                }

                event.target.value = ''; // Reset file input
            };
            
            handleSelectTrack(trackId) {
                const index = this.state.playlist.findIndex(t => t.id === trackId);
                if (index !== -1) {
                    this.loadAndPlayTrack(index);
                }
            }

            handleToggleSelection(trackId) {
                const newSet = new Set(this.state.selectedTrackIds);
                if (newSet.has(trackId)) {
                    newSet.delete(trackId);
                } else {
                    newSet.add(trackId);
                }
                this.setState({ selectedTrackIds: newSet });
            }

            handleToggleSelectAll() {
                const allDisplayedSelected = this.displayedPlaylist.length > 0 && 
                                             this.displayedPlaylist.every(t => this.state.selectedTrackIds.has(t.id));

                const newSelectedIds = new Set(this.state.selectedTrackIds);
                const displayedIds = this.displayedPlaylist.map(t => t.id);
                
                if (allDisplayedSelected) {
                    displayedIds.forEach(id => newSelectedIds.delete(id));
                } else {
                    displayedIds.forEach(id => newSelectedIds.add(id));
                }
                this.setState({ selectedTrackIds: newSelectedIds });
            }
            
            handleDeleteSelected() {
                if (this.state.selectedTrackIds.size === 0) return;

                // **NOTE: Custom confirmation modal should be used here instead of window.confirm/alert**
                
                const currentPlayingTrack = this.state.currentTrackIndex !== null ? this.state.playlist[this.state.currentTrackIndex] : null;

                // 1. Pause if current track is deleted
                if (currentPlayingTrack && this.state.selectedTrackIds.has(currentPlayingTrack.id)) {
                    this.audio.pause();
                    this.audio.src = '';
                    this.visualizer?.stop();
                }

                const tracksToDelete = this.state.playlist.filter(track => this.state.selectedTrackIds.has(track.id));
                const newPlaylist = this.state.playlist.filter(track => !this.state.selectedTrackIds.has(track.id));
                
                // 2. Find new index (must be done before setting new playlist state)
                let newTrackIndex = null;
                if (currentPlayingTrack && !this.state.selectedTrackIds.has(currentPlayingTrack.id)) {
                    newTrackIndex = newPlaylist.findIndex(t => t.id === currentPlayingTrack.id);
                }
                
                // 3. Update state
                this.setState({
                    playlist: newPlaylist,
                    currentTrackIndex: newTrackIndex,
                    selectedTrackIds: new Set(),
                    isPlaying: newPlaylist.length === 0 ? false : this.state.isPlaying,
                    currentTime: newPlaylist.length === 0 ? 0 : this.state.currentTime,
                    duration: newPlaylist.length === 0 ? 0 : this.state.duration,
                });
                
                // 4. Revoke URLs
                tracksToDelete.forEach(track => URL.revokeObjectURL(track.url));
            }

            // --- Toggle Functions ---

            toggleRepeatMode() {
                this.setState({ repeatMode: (this.state.repeatMode + 1) % 3 });
            }

            toggleShuffle() {
                this.setState({ isShuffled: !this.state.isShuffled });
            }

            toggleVisualizer() {
                this.setState({ showVisualizer: !this.state.showVisualizer });
                if (this.visualizer) {
                    this.state.showVisualizer ? this.visualizer.stop() : (this.state.isPlaying ? this.visualizer.start() : null);
                }
            }

            toggleVisualizerMode() {
                const newIndex = (this.state.visualizerModeIndex + 1) % visualizerModes.length;
                this.setState({ visualizerModeIndex: newIndex });
                if (this.visualizer) {
                    this.visualizer.setMode(newIndex);
                }
            }
            
            toggleSidebar() {
                this.setState({ isSidebarVisible: !this.state.isSidebarVisible });
            }

            toggleEq() {
                this.setState({ isEqVisible: !this.state.isEqVisible });
                if (!this.state.isEqVisible) {
                    this.equalizerModal.open();
                } else {
                    this.equalizerModal.close();
                }
            }
            
            handleSort() {
                let { key, direction } = this.state.sortConfig;
                if (key === 'name' && direction === 'asc') key = 'name', direction = 'desc';
                else if (key === 'name' && direction === 'desc') key = 'artist', direction = 'asc';
                else if (key === 'artist' && direction === 'asc') key = 'artist', direction = 'desc';
                else key = 'name', direction = 'asc';
                this.setState({ sortConfig: { key, direction } });
            }

            // --- Event Listeners for Audio Element ---
            
            setupAudioListeners() {
                this.audio.addEventListener('timeupdate', () => {
                    this.setState({ currentTime: this.audio.currentTime });
                    document.getElementById('current-time-display').textContent = formatTime(this.audio.currentTime);
                    document.getElementById('seek-slider').value = this.audio.currentTime;
                });
                
                this.audio.addEventListener('loadedmetadata', () => {
                    this.setState({ duration: this.audio.duration });
                    document.getElementById('duration-display').textContent = formatTime(this.audio.duration);
                    document.getElementById('seek-slider').max = this.audio.duration;
                });

                this.audio.addEventListener('ended', () => {
                    if (this.state.repeatMode === RepeatMode.ONE) {
                        this.audio.currentTime = 0;
                        this.audio.play();
                    } else {
                        this.handleNext();
                    }
                });
            }
            
            // --- Rendering Functions ---
            
            renderPlaylist() {
                const container = document.getElementById('playlist-container');
                if (!container) return;
                
                const currentTrack = this.state.currentTrackIndex !== null ? this.state.playlist[this.state.currentTrackIndex] : null;
                const allDisplayedSelected = this.displayedPlaylist.length > 0 && 
                                             this.displayedPlaylist.every(t => this.state.selectedTrackIds.has(t.id));
                
                // Update Select All Checkbox
                const selectAll = document.getElementById('select-all-tracks');
                if (selectAll) {
                    selectAll.checked = allDisplayedSelected;
                    selectAll.indeterminate = this.state.selectedTrackIds.size > 0 && !allDisplayedSelected;
                }
                const deleteButton = document.getElementById('delete-selected-button');
                if (deleteButton) {
                    deleteButton.style.display = this.state.selectedTrackIds.size > 0 ? 'inline-block' : 'none';
                }

                // Render List Items
                if (this.displayedPlaylist.length === 0) {
                    container.innerHTML = `
                        <div class="text-center text-gray-500 mt-10">
                            <p>재생목록이 비었습니다.</p>
                            <p class="text-sm">아래 폴더 아이콘을 클릭하여</p>
                            <p class="text-sm">음악 파일을 추가하세요.</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = this.displayedPlaylist.map(track => {
                    const isCurrent = currentTrack?.id === track.id;
                    const isSelected = this.state.selectedTrackIds.has(track.id);
                    const classes = `flex items-center p-2 rounded-md transition-colors ${isCurrent ? 'bg-cyan-500/30' : isSelected ? 'bg-blue-600/30' : 'hover:bg-white/10'}`;
                    
                    return `
                        <div id="track-${track.id}" class="${classes}">
                            <input type="checkbox" 
                                class="bg-gray-700 border-gray-600 text-cyan-500 rounded focus:ring-cyan-600 focus:ring-offset-gray-800 mr-3 flex-shrink-0"
                                onchange="window.playerApp.handleToggleSelection('${track.id}')"
                                ${isSelected ? 'checked' : ''}
                            />
                            <div onclick="window.playerApp.handleSelectTrack('${track.id}')" class="flex-grow flex items-center cursor-pointer overflow-hidden">
                                <img src="https://placehold.co/40x40/334155/ffffff?text=M" alt="album art" class="w-10 h-10 rounded-md mr-3 flex-shrink-0" />
                                <div class="flex-grow overflow-hidden">
                                    <p class="text-sm font-semibold truncate">${track.name}</p>
                                    <p class="text-xs text-gray-400 truncate">${track.artist}</p>
                                </div>
                                <span class="text-xs text-gray-400 ml-3">${formatTime(track.duration)}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            updateAudioControls() {
                const { isPlaying, isShuffled, repeatMode, volume, currentTrackIndex } = this.state;
                const isDisabled = currentTrackIndex === null;
                
                // Play/Pause button
                const playPauseBtn = document.getElementById('play-pause-btn');
                if (playPauseBtn) {
                    playPauseBtn.innerHTML = getIconSvg(isPlaying ? 'pause' : 'play', 'w-8 h-8');
                    playPauseBtn.title = isPlaying ? "일시정지" : "재생";
                    playPauseBtn.disabled = isDisabled;
                    playPauseBtn.className = `w-14 h-14 flex items-center justify-center bg-cyan-400 text-black rounded-full hover:bg-cyan-300 transition-transform transform hover:scale-105 ${isDisabled ? 'bg-gray-600' : ''}`;
                }
                
                // Shuffle button
                const shuffleBtn = document.getElementById('shuffle-btn');
                if (shuffleBtn) {
                    shuffleBtn.className = `p-2 rounded-full text-xl transition-opacity ${isShuffled ? 'opacity-100 text-cyan-400' : 'opacity-50 text-white'} hover:opacity-100`;
                    shuffleBtn.title = isShuffled ? "셔플 끄기" : "셔플 켜기";
                }
                
                // Repeat button
                const repeatBtn = document.getElementById('repeat-btn');
                if (repeatBtn) {
                    let repeatHtml = '🔁';
                    if (repeatMode === RepeatMode.ONE) {
                        repeatHtml += '<span class="absolute top-0 right-0 text-xs font-bold bg-cyan-500 text-black rounded-full w-4 h-4 flex items-center justify-center">1</span>';
                    }
                    repeatBtn.innerHTML = repeatHtml;
                    repeatBtn.className = `p-2 rounded-full relative text-xl transition-opacity ${repeatMode !== RepeatMode.NONE ? 'opacity-100 text-cyan-400' : 'opacity-50 text-white'} hover:opacity-100`;
                    
                    const repeatTooltips = ["반복 안함", "한 곡 반복", "전체 반복"];
                    repeatBtn.title = repeatTooltips[repeatMode];
                }
                
                // Volume slider
                const volumeSlider = document.getElementById('volume-slider');
                if (volumeSlider) volumeSlider.value = volume;
                
                // Seek slider
                const seekSlider = document.getElementById('seek-slider');
                if (seekSlider) seekSlider.disabled = isDisabled;
            }

            renderVisualizerArea() {
                const container = document.getElementById('visualizer-area');
                const currentTrack = this.state.currentTrackIndex !== null ? this.state.playlist[this.state.currentTrackIndex] : null;

                if (!container) return;
                container.innerHTML = '';
                
                if (this.state.showVisualizer && this.state.isPlaying) {
                    // Visualizer is handled by the Visualizer class instance (this.visualizer)
                    // The canvas is already appended to the container on init, we just ensure it's visible.
                    this.visualizer.canvas.style.display = 'block';
                    this.visualizer.start();
                } else {
                    this.visualizer.stop();
                    this.visualizer.canvas.style.display = 'none';

                    if (currentTrack) {
                        container.innerHTML = `<img src="https://placehold.co/600x600/334155/ffffff?text=ALBUM+ART" alt="album art" class="w-full h-full object-cover" />`;
                    } else {
                        container.innerHTML = `
                            <div class="text-center">
                                ${getIconSvg('music-note', 'w-24 h-24 text-gray-600 mx-auto')}
                                <p>재생할 트랙을 선택하세요.</p>
                            </div>
                        `;
                    }
                }
            }
            
            renderControlsBar() {
                // Update EQ/Visualizer toggle colors
                const eqBtn = document.getElementById('toggle-eq-btn');
                if (eqBtn) eqBtn.className = `p-2 rounded-md hover:bg-white/10 ${this.state.isEqVisible ? 'text-cyan-400' : 'text-gray-400'}`;
                
                const visBtn = document.getElementById('toggle-visualizer-btn');
                if (visBtn) visBtn.className = `p-2 rounded-md hover:bg-white/10 ${!this.state.showVisualizer ? 'text-cyan-400' : 'text-gray-400'}`;
                
                const sidebarBtn = document.getElementById('toggle-sidebar-btn');
                if (sidebarBtn) sidebarBtn.className = `p-2 rounded-md hover:bg-white/10 ${this.state.isSidebarVisible ? 'text-cyan-400' : 'text-gray-400'}`;
                
                // Update main layout classes
                const main = document.getElementById('main-content');
                const sidebar = document.getElementById('sidebar-area');
                const section = document.getElementById('player-section');
                
                if (main && sidebar && section) {
                    if (this.state.isSidebarVisible) {
                        main.classList.add('space-x-4');
                        sidebar.classList.remove('hidden', 'w-0');
                        sidebar.classList.add('w-1/3');
                        section.classList.remove('w-full');
                        section.classList.add('w-2/3');
                    } else {
                        main.classList.remove('space-x-4');
                        sidebar.classList.add('hidden', 'w-0');
                        sidebar.classList.remove('w-1/3');
                        section.classList.add('w-full');
                        section.classList.remove('w-2/3');
                    }
                }
                
                // Update track info
                const currentTrack = this.state.currentTrackIndex !== null ? this.state.playlist[this.state.currentTrackIndex] : null;
                const trackInfo = document.getElementById('track-info');
                if (trackInfo) {
                    trackInfo.textContent = currentTrack ? `${currentTrack.name} - ${currentTrack.artist}` : '재생 중인 트랙 없음';
                }
            }
            
            render() {
                this.renderPlaylist();
                this.renderVisualizerArea();
                this.renderControlsBar();
                this.updateAudioControls();
            }

            // --- Initialization ---

            init() {
                window.playerApp = this; // Make the instance globally accessible for inline events
                
                this.renderBaseLayout();
                this.visualizer = new Visualizer(document.getElementById('visualizer-area'));
                this.setupAudioListeners();
                
                // Attach file input handler
                this.fileInput.onchange = this.handleFileChange;
                
                // Initial render
                this.render();
            }

            renderBaseLayout() {
                const appHtml = `
                    <div class="w-[950px] h-[720px] bg-gray-800/70 backdrop-blur-sm rounded-lg shadow-2xl border border-gray-700 text-white flex flex-col">
                        <header class="flex items-center justify-between p-3 border-b border-gray-700 flex-shrink-0">
                            <div class="flex items-center space-x-3">
                                <span class="text-3xl">🎵</span>
                                <h1 class="text-lg font-semibold tracking-wider">Jowon Music Player</h1>
                                <span id="track-info" class="text-sm text-gray-400 ml-4">재생 중인 트랙 없음</span>
                            </div>
                        </header>

                        <main id="main-content" class="flex flex-grow p-4 space-x-4 overflow-hidden">
                            <!-- SIDEBAR -->
                            <aside id="sidebar-area" class="w-1/3 flex flex-col bg-black/20 rounded-md transition-all duration-300 flex-shrink-0">
                                <div class="flex items-center justify-between p-3 border-b border-gray-700/50 flex-shrink-0">
                                    <div class="flex items-center space-x-3">
                                        <input type="checkbox" id="select-all-tracks" 
                                               class="bg-gray-700 border-gray-600 text-cyan-500 rounded focus:ring-cyan-600 focus:ring-offset-gray-800"
                                               onchange="window.playerApp.handleToggleSelectAll()"
                                               title="전체 선택/해제"
                                        />
                                        <h2 class="font-bold">파일 목록</h2>
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        <button id="delete-selected-button" onclick="window.playerApp.handleDeleteSelected()" 
                                                title="선택한 항목 삭제" 
                                                class="p-1 rounded-md text-red-400 hover:bg-red-500/20"
                                                style="display: none;">
                                            ${getIconSvg('trash', 'w-5 h-5')}
                                        </button>
                                        <button onclick="window.playerApp.handleSort()" 
                                                title="정렬" 
                                                class="p-1 rounded-md hover:bg-white/10">
                                            ${getIconSvg('sort', 'w-5 h-5 text-gray-400')}
                                        </button>
                                    </div>
                                </div>
                                <div id="playlist-container" class="overflow-y-auto p-2 space-y-1">
                                    <!-- Playlist items will be injected here -->
                                </div>
                            </aside>

                            <!-- PLAYER SECTION -->
                            <section id="player-section" class="w-2/3 flex flex-col space-y-4 transition-all duration-300">
                                <div id="visualizer-area" class="flex-grow bg-black/30 rounded-md relative overflow-hidden flex items-center justify-center text-gray-500">
                                   <!-- Visualizer canvas or album art will be managed here -->
                                </div>
                                <div class="flex items-center space-x-4">
                                    <span id="current-time-display" class="text-xs w-12 text-center">0:00</span>
                                    <input type="range" id="seek-slider" min="0" max="0" value="0" 
                                           oninput="window.playerApp.handleSeek(this)"
                                           class="w-full h-1.5 bg-gray-600 rounded-lg appearance-none cursor-pointer range-sm accent-cyan-400" disabled/>
                                    <span id="duration-display" class="text-xs w-12 text-center">0:00</span>
                                </div>
                                <div class="flex items-center justify-between bg-black/20 p-3 rounded-md">
                                     <!-- Left Controls (Shuffle/Repeat) -->
                                     <div class="flex items-center space-x-4">
                                        <button id="shuffle-btn" onclick="window.playerApp.toggleShuffle()" title="셔플 켜기" class="p-2 rounded-full text-xl opacity-50 text-white transition-opacity"> <span>🔀</span> </button>
                                        <button id="repeat-btn" onclick="window.playerApp.toggleRepeatMode()" title="반복 안함" class="p-2 rounded-full relative text-xl opacity-50 text-white transition-opacity"> <span>🔁</span> </button>
                                     </div>
                                     <!-- Center Controls (Prev/Play/Next) -->
                                     <div class="flex items-center space-x-4">
                                        <button onclick="window.playerApp.handlePrev()" title="이전 곡" class="p-2 rounded-full text-gray-300 hover:bg-white/10 disabled:text-gray-600" disabled> ${getIconSvg('prev', 'w-7 h-7')} </button>
                                        <button id="play-pause-btn" onclick="window.playerApp.handlePlayPause()" title="재생" class="w-14 h-14 flex items-center justify-center bg-cyan-400 text-black rounded-full hover:bg-cyan-300 transition-transform transform hover:scale-105 disabled:bg-gray-600" disabled>
                                            ${getIconSvg('play', 'w-8 h-8')}
                                        </button>
                                        <button onclick="window.playerApp.handleNext()" title="다음 곡" class="p-2 rounded-full text-gray-300 hover:bg-white/10 disabled:text-gray-600" disabled> ${getIconSvg('next', 'w-7 h-7')} </button>
                                     </div>
                                     <!-- Right Controls (Volume) -->
                                     <div class="flex items-center space-x-3 w-1/4">
                                        ${getIconSvg('volume', 'w-5 h-5 text-gray-400')}
                                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" 
                                               oninput="window.playerApp.handleVolumeChange(this)"
                                               class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer range-sm accent-cyan-400"/>
                                     </div>
                                </div>
                                <!-- Utility Bar -->
                                <div class="flex items-center justify-between bg-black/20 p-2 rounded-md">
                                    <div class="flex items-center space-x-2">
                                        <button onclick="window.playerApp.fileInput.click()" title="오디오 파일 추가" class="p-2 rounded-md hover:bg-white/10 text-gray-400">${getIconSvg('folder', 'w-5 h-5')}</button>
                                        <button id="toggle-visualizer-btn" onclick="window.playerApp.toggleVisualizer()" title="앨범 아트 보기" class="p-2 rounded-md hover:bg-white/10 text-gray-400">${getIconSvg('gallery', 'w-5 h-5')}</button>
                                        <button onclick="window.playerApp.toggleVisualizerMode()" title="시각화 모드 변경" class="p-2 rounded-md hover:bg-white/10 text-gray-400">${getIconSvg('chart-bar', 'w-5 h-5')}</button>
                                        <button id="toggle-eq-btn" onclick="window.playerApp.toggleEq()" title="이퀄라이저" class="p-2 rounded-md hover:bg-white/10 text-gray-400">${getIconSvg('equalizer', 'w-5 h-5')}</button>
                                        <button id="toggle-sidebar-btn" onclick="window.playerApp.toggleSidebar()" title="사이드바 숨기기" class="p-2 rounded-md hover:bg-white/10 text-cyan-400">${getIconSvg('list', 'w-5 h-5')}</button>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <div class="relative">
                                            ${getIconSvg('search', 'w-4 h-4 absolute top-1/2 left-3 -translate-y-1/2 text-gray-500')}
                                            <input type="text" placeholder="검색" value="" 
                                                   oninput="window.playerApp.setState({ searchTerm: this.value })"
                                                   class="bg-gray-900/50 border border-gray-700 rounded-md py-1.5 pl-9 pr-3 text-sm w-40 focus:ring-cyan-500 focus:border-cyan-500 outline-none" />
                                        </div>
                                        <button onclick="window.location.reload()" title="새로고침" class="p-2 rounded-md hover:bg-white/10 text-gray-400">${getIconSvg('refresh', 'w-5 h-5')}</button>
                                    </div>
                                </div>
                            </section>
                        </main>
                    </div>
                `;
                document.getElementById('app').innerHTML = appHtml;
            }
        }
    </script>
</body>
</html>
