<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Flat Calculator</title>
    <style>
        /* 머티리얼 디자인 기본 스펙 정의 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #edeec9; /* 부드러운 머티리얼 톤 배경 */
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
        }

        /* 계산기 바디 (머티리얼 카드 스타일) */
        .calculator {
            width: 340px;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            /* 머티리얼 디자인 특유의 입체감 있는 섀도우(Elevation 8dp 구성을 응용) */
            box-shadow: 0px 5px 5px -3px rgba(0,0,0,0.2), 
                        0px 8px 10px 1px rgba(0,0,0,0.14), 
                        0px 3px 14px 2px rgba(0,0,0,0.12);
        }

        /* 디스플레이 영역 (플랫한 단색 분할) */
        .display {
            background-color: #263238; /* Blue Grey 900 */
            color: #ffffff;
            padding: 32px 24px;
            text-align: right;
        }

        #history {
            font-size: 0.9rem;
            color: #b0bec5; /* Blue Grey 200 */
            min-height: 1.2rem;
            margin-bottom: 8px;
            word-wrap: break-word;
            font-weight: 300;
        }

        #result {
            font-size: 2.5rem;
            font-weight: 400;
            overflow-x: auto;
            white-space: nowrap;
        }

        #result::-webkit-scrollbar {
            height: 0px;
        }

        /* 버튼 패널 그리드 레이아웃 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 12px;
            gap: 8px;
            background-color: #fafafa;
        }

        /* 공통 머티리얼 플랫 버튼 스타일 */
        button {
            position: relative; /* 리플 효과를 위한 기준점 */
            overflow: hidden;
            border: none;
            outline: none;
            height: 64px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: 500;
            cursor: pointer;
            background-color: #ffffff;
            color: #37474f; /* Blue Grey 800 */
            transition: background-color 0.2s, box-shadow 0.2s;
            /* Flat 버튼 기본 섀도우 */
            box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.1), 
                        0px 1px 1px 0px rgba(0,0,0,0.06), 
                        0px 1px 3px 0px rgba(0,0,0,0.05);
        }

        /* 버튼 호버 시 살짝 어두워짐 */
        button:hover {
            background-color: #f5f5f5;
        }

        /* 기능 버튼 스타일 (AC, ⌫, %) */
        button.action {
            background-color: #cfd8dc; /* Blue Grey 100 */
            color: #263238;
        }
        button.action:hover {
            background-color: #b0bec5;
        }

        /* 연산자 버튼 스타일 (+, -, ×, ÷) */
        button.operator {
            background-color: #ffe0b2; /* Orange 100 */
            color: #ef6c00; /* Orange 800 */
        }
        button.operator:hover {
            background-color: #ffcc80;
        }

        /* 등호 버튼 (머티리얼 프라이머리 컬러 강조) */
        button.equals {
            background-color: #2196f3; /* Blue 500 */
            color: #ffffff;
            font-weight: 700;
        }
        button.equals:hover {
            background-color: #1e88e5;
        }

        /* 자바스크립트로 제어할 잉크 리플 효과 스타일 */
        .ripple {
            position: absolute;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.4s linear;
            pointer-events: none;
        }
        button.equals .ripple {
            background: rgba(255, 255, 255, 0.3);
        }
        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- 머티리얼 상단 디스플레이 -->
        <div class="display">
            <div id="history"></div>
            <div id="result">0</div>
        </div>

        <!-- 머티리얼 하단 키패드 -->
        <div class="keypad">
            <button class="action" onclick="clearDisplay()">AC</button>
            <button class="action" onclick="deleteLast()">⌫</button>
            <button class="action" onclick="inputOperator('%')">%</button>
            <button class="operator" onclick="inputOperator('/')">÷</button>

            <button onclick="inputNumber('7')">7</button>
            <button onclick="inputNumber('8')">8</button>
            <button onclick="inputNumber('9')">9</button>
            <button class="operator" onclick="inputOperator('*')">×</button>

            <button onclick="inputNumber('4')">4</button>
            <button onclick="inputNumber('5')">5</button>
            <button onclick="inputNumber('6')">6</button>
            <button class="operator" onclick="inputOperator('-')">-</button>

            <button onclick="inputNumber('1')">1</button>
            <button onclick="inputNumber('2')">2</button>
            <button onclick="inputNumber('3')">3</button>
            <button class="operator" onclick="inputOperator('+')">+</button>

            <button onclick="inputNumber('0')" style="grid-column: span 2;">0</button>
            <button onclick="inputNumber('.')">.</button>
            <button class="equals" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        const resultView = document.getElementById('result');
        const historyView = document.getElementById('history');
        
        let expressionStr = '0';
        let isEvaluationDone = false;

        // 머티리얼 리플(Ripple) 효과 구현
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.marginLeft = `${-size/2}px`;
                ripple.style.marginTop = `${-size/2}px`;

                this.appendChild(ripple);
                
                ripple.addEventListener('animationend', () => {
                    ripple.remove();
                });
            });
        });

        // 숫자 및 소수점 입력
        function inputNumber(num) {
            if (expressionStr === '0' && num !== '.') {
                expressionStr = num;
            } else if (isEvaluationDone) {
                expressionStr = num === '.' ? '0.' : num;
                isEvaluationDone = false;
            } else {
                if (num === '.' && expressionStr.split(/[\+\-\*\/%]/).pop().includes('.')) return;
                expressionStr += num;
            }
            render();
        }

        // 연산자 입력 (중복 및 연속 입력 예외 처리 포함)
        function inputOperator(op) {
            if (isEvaluationDone) isEvaluationDone = false;

            const trimmed = expressionStr.trim();
            const lastInput = trimmed.slice(-1);
            const ops = ['+', '-', '*', '/', '%'];

            if (ops.includes(lastInput)) {
                expressionStr = trimmed.slice(0, -1) + op;
            } else {
                expressionStr += op;
            }
            render();
        }

        // 전체 초기화 (AC)
        function clearDisplay() {
            expressionStr = '0';
            historyView.innerText = '';
            isEvaluationDone = false;
            render();
        }

        // 하나만 지우기 (⌫)
        function deleteLast() {
            if (isEvaluationDone) {
                clearDisplay();
                return;
            }
            if (expressionStr.length > 1) {
                expressionStr = expressionStr.slice(0, -1);
            } else {
                expressionStr = '0';
            }
            render();
        }

        // 수식 연산 및 결과 도출
        function calculateResult() {
            if (!expressionStr) return;
            
            let targetExpression = expressionStr;
            const ops = ['+', '-', '*', '/', '%'];
            
            // 수식 끝에 연산자가 수식어로 남아있을 경우 자동 제거
            if (ops.includes(targetExpression.slice(-1))) {
                targetExpression = targetExpression.slice(0, -1);
            }

            try {
                // 안전한 수식 파싱 연산 실행
                const evalFn = new Function(`return ${targetExpression}`);
                const calcValue = evalFn();
                
                // 부동 소수점 오차 제어 (최대 8자리 제한 후 후행 0 제거)
                const formattedValue = Number(calcValue.toFixed(8)).toString();
                
                historyView.innerText = expressionStr.replace(/\*/g, '×').replace(/\//g, '÷') + ' =';
                expressionStr = formattedValue;
                isEvaluationDone = true;
            } catch (err) {
                expressionStr = 'Error';
                isEvaluationDone = true;
            }
            render();
        }

        // 브라우저 렌더링 맵핑
        function render() {
            let userFriendlyView = expressionStr.replace(/\*/g, '×').replace(/\//g, '÷');
            resultView.innerText = userFriendlyView;
        }
    </script>
</body>
</html>
