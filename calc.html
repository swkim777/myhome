<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공학용 계산기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --bg-alt: #111d37;
            --surface: rgba(15, 23, 42, 0.85);
            --surface-alt: rgba(17, 29, 55, 0.85);
            --border: rgba(148, 163, 184, 0.2);
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #f87171;
            --shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            color: var(--text-primary);
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 55%, #020617 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        main.layout {
            width: min(1200px, 100%);
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .calculator-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .calculator-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .calculator-header h1 {
            font-size: 1.8rem;
            margin: 0;
        }

        .calculator-header p {
            margin: 4px 0 0;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .home-button {
            border: 1px solid transparent;
            background: var(--surface-alt);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .home-button:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.35);
        }

        .display {
            background: var(--surface-alt);
            border-radius: 20px;
            padding: 18px 20px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            overflow: hidden;
        }

        .expression-display {
            font-size: 1rem;
            color: var(--text-secondary);
            min-height: 24px;
            word-break: break-all;
        }

        .result-display {
            font-size: 2.4rem;
            font-weight: 600;
            text-align: right;
            word-break: break-all;
        }

        .result-display.preview {
            color: rgba(56, 189, 248, 0.85);
            font-size: 1.8rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .toggle-button {
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-button:hover {
            background: rgba(56, 189, 248, 0.18);
        }

        .memory-indicator {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--accent);
            background: transparent;
            opacity: 0.2;
            transition: all 0.2s ease;
        }

        .memory-indicator.active {
            opacity: 1;
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(56, 189, 248, 0.12);
        }

        .button-groups {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .advanced-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .keypad-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        button.calc-button {
            position: relative;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(148, 163, 184, 0.15);
            color: var(--text-primary);
            font-size: 1rem;
            padding: 14px 10px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.2s ease, background 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        button.calc-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.35);
            border-color: rgba(56, 189, 248, 0.3);
        }

        button.calc-button:active {
            transform: translateY(1px);
            box-shadow: inset 0 4px 12px rgba(15, 23, 42, 0.45);
        }

        button.calc-button.operator {
            background: rgba(56, 189, 248, 0.18);
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--accent);
        }

        button.calc-button.emphasis {
            background: var(--accent);
            border-color: transparent;
            color: #0b1120;
            font-size: 1.1rem;
        }

        button.calc-button.emphasis:hover {
            background: var(--accent-strong);
        }

        button.calc-button.danger {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.35);
            background: rgba(248, 113, 113, 0.12);
        }

        .keypad-grid button.calc-button {
            font-size: 1.15rem;
        }

        .history-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 24px;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .history-panel h2 {
            margin: 0;
            font-size: 1.4rem;
        }

        .history-help {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .history-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 420px;
            overflow-y: auto;
        }

        .history-entry {
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 16px;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.55);
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .history-entry button {
            all: unset;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-entry:hover {
            border-color: rgba(56, 189, 248, 0.35);
            background: rgba(30, 41, 59, 0.75);
        }

        .history-expression {
            color: var(--text-secondary);
            font-size: 0.9rem;
            word-break: break-all;
        }

        .history-result {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .history-clear {
            align-self: flex-start;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: transparent;
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .history-clear:hover {
            color: var(--text-primary);
            border-color: rgba(56, 189, 248, 0.35);
        }

        @media (max-width: 980px) {
            body {
                padding: 24px 12px;
            }

            .calculator-card {
                order: 0;
            }

            .history-panel {
                order: 1;
            }
        }

        @media (max-width: 640px) {
            .calculator-card {
                padding: 22px;
            }

            .advanced-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .keypad-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }

            .result-display {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <main class="layout">
        <section class="calculator-card" aria-label="공학용 계산기">
            <header class="calculator-header">
                <div>
                    <h1>공학용 계산기</h1>
                    <p>삼각함수, 로그, 거듭제곱 등 다양한 고급 연산을 지원합니다.</p>
                </div>
                <button type="button" class="home-button" onclick="window.location.href='index.html'">홈으로</button>
            </header>

            <div class="display" aria-live="polite">
                <div id="expression-display" class="expression-display">0</div>
                <div id="result-display" class="result-display">0</div>
            </div>

            <div class="status-bar">
                <button type="button" id="angle-toggle" class="toggle-button" aria-pressed="false">각도 단위: DEG</button>
                <span id="memory-indicator" class="memory-indicator" title="메모리에 값이 저장되어 있으면 표시됩니다." aria-hidden="true">M</span>
            </div>

            <div class="button-groups">
                <div class="advanced-grid" aria-label="고급 기능 키패드">
                    <button type="button" class="calc-button" data-action="memory-clear">MC</button>
                    <button type="button" class="calc-button" data-action="memory-recall">MR</button>
                    <button type="button" class="calc-button" data-action="memory-add">M+</button>
                    <button type="button" class="calc-button" data-action="memory-subtract">M-</button>
                    <button type="button" class="calc-button" data-action="memory-store">MS</button>

                    <button type="button" class="calc-button" data-action="insert-ans">Ans</button>
                    <button type="button" class="calc-button" data-action="toggle-sign">±</button>
                    <button type="button" class="calc-button" data-value="(">(</button>
                    <button type="button" class="calc-button" data-value=")">)</button>
                    <button type="button" class="calc-button danger" data-action="clear">AC</button>

                    <button type="button" class="calc-button" data-value="sin(">sin</button>
                    <button type="button" class="calc-button" data-value="cos(">cos</button>
                    <button type="button" class="calc-button" data-value="tan(">tan</button>
                    <button type="button" class="calc-button" data-value="asin(">asin</button>
                    <button type="button" class="calc-button" data-value="acos(">acos</button>

                    <button type="button" class="calc-button" data-value="atan(">atan</button>
                    <button type="button" class="calc-button" data-value="log(">log</button>
                    <button type="button" class="calc-button" data-value="ln(">ln</button>
                    <button type="button" class="calc-button" data-value="sqrt(">√</button>
                    <button type="button" class="calc-button" data-value="cbrt(">∛</button>

                    <button type="button" class="calc-button" data-value="abs(">|x|</button>
                    <button type="button" class="calc-button" data-value="exp(">exp</button>
                    <button type="button" class="calc-button" data-action="square">x²</button>
                    <button type="button" class="calc-button" data-action="cube">x³</button>
                    <button type="button" class="calc-button" data-value="^">xʸ</button>

                    <button type="button" class="calc-button" data-action="ten-power">10ˣ</button>
                    <button type="button" class="calc-button" data-action="reciprocal">1/x</button>
                    <button type="button" class="calc-button" data-value="!">n!</button>
                    <button type="button" class="calc-button" data-value="mod">mod</button>
                    <button type="button" class="calc-button" data-value="%">%</button>

                    <button type="button" class="calc-button" data-value="pi">π</button>
                    <button type="button" class="calc-button" data-value="e">e</button>
                    <button type="button" class="calc-button" data-value=",">,</button>
                    <button type="button" class="calc-button" data-action="random">Rand</button>
                    <button type="button" class="calc-button" data-action="delete">DEL</button>
                </div>

                <div class="keypad-grid" aria-label="숫자 키패드">
                    <button type="button" class="calc-button" data-value="7">7</button>
                    <button type="button" class="calc-button" data-value="8">8</button>
                    <button type="button" class="calc-button" data-value="9">9</button>
                    <button type="button" class="calc-button operator" data-value="/">÷</button>

                    <button type="button" class="calc-button" data-value="4">4</button>
                    <button type="button" class="calc-button" data-value="5">5</button>
                    <button type="button" class="calc-button" data-value="6">6</button>
                    <button type="button" class="calc-button operator" data-value="*">×</button>

                    <button type="button" class="calc-button" data-value="1">1</button>
                    <button type="button" class="calc-button" data-value="2">2</button>
                    <button type="button" class="calc-button" data-value="3">3</button>
                    <button type="button" class="calc-button operator" data-value="-">−</button>

                    <button type="button" class="calc-button" data-value="0">0</button>
                    <button type="button" class="calc-button" data-value="00">00</button>
                    <button type="button" class="calc-button" data-value=".">.</button>
                    <button type="button" class="calc-button operator" data-value="+">+</button>

                    <button type="button" class="calc-button emphasis" data-action="evaluate" style="grid-column: span 4;">=</button>
                </div>
            </div>
        </section>

        <aside class="history-panel" aria-label="계산 기록">
            <div>
                <h2>계산 기록</h2>
                <p class="history-help">최근 계산 12개가 저장됩니다. 항목을 눌러 수식을 다시 불러올 수 있습니다.</p>
            </div>
            <ul id="history-list" class="history-list"></ul>
            <button type="button" id="clear-history" class="history-clear">기록 지우기</button>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.0/lib/browser/math.js"></script>
    <script>
        const expressionDisplay = document.getElementById('expression-display');
        const resultDisplay = document.getElementById('result-display');
        const angleToggle = document.getElementById('angle-toggle');
        const historyList = document.getElementById('history-list');
        const clearHistoryButton = document.getElementById('clear-history');
        const memoryIndicator = document.getElementById('memory-indicator');

        const mathInstance = math.create(math.all);
        mathInstance.config({ number: 'number', precision: 14 });

        let expression = '';
        let angleMode = 'DEG';
        let memoryValue = 0;
        let historyEntries = [];
        let lastResultRaw = 0;
        let lastResultExpression = '0';

        const toRadians = (deg) => deg * Math.PI / 180;
        const toDegrees = (rad) => rad * 180 / Math.PI;

        const customFunctions = () => ({
            sin: (x) => Math.sin(angleMode === 'DEG' ? toRadians(x) : x),
            cos: (x) => Math.cos(angleMode === 'DEG' ? toRadians(x) : x),
            tan: (x) => Math.tan(angleMode === 'DEG' ? toRadians(x) : x),
            asin: (x) => angleMode === 'DEG' ? toDegrees(Math.asin(x)) : Math.asin(x),
            acos: (x) => angleMode === 'DEG' ? toDegrees(Math.acos(x)) : Math.acos(x),
            atan: (x) => angleMode === 'DEG' ? toDegrees(Math.atan(x)) : Math.atan(x),
            ln: (x) => mathInstance.log(x),
            log: (x) => mathInstance.log10(x),
            abs: (x) => Math.abs(x),
            exp: (x) => Math.exp(x),
            cbrt: (x) => Math.cbrt(x),
            rand: () => Math.random(),
            neg: (x) => -x,
            inv: (x) => 1 / x
        });

        function registerCustomFunctions() {
            mathInstance.import(customFunctions(), { override: true });
        }

        registerCustomFunctions();

        function sanitizeExpression(raw) {
            if (!raw) return '';
            let sanitized = raw;
            sanitized = sanitized.replace(/π/g, 'pi');
            sanitized = sanitized.replace(/−/g, '-');
            sanitized = sanitized.replace(/×/g, '*');
            sanitized = sanitized.replace(/÷/g, '/');
            sanitized = sanitized.replace(/mod/g, ' mod ');
            sanitized = sanitized.replace(/Ans/g, lastResultExpression);
            sanitized = sanitized.replace(/\s+/g, ' ');
            sanitized = convertPercentages(sanitized);
            return sanitized;
        }

        function convertPercentages(expr) {
            return expr.replace(/(pi|e|[0-9]*\.?[0-9]+|\([^()]*\))%/g, (_, value) => `(${value}/100)`);
        }

        function evaluateExpression() {
            if (!expression) {
                resultDisplay.textContent = formatValue(lastResultRaw);
                resultDisplay.classList.remove('preview');
                return;
            }

            const expressionForHistory = expression;
            try {
                const sanitized = sanitizeExpression(expression);
                const result = mathInstance.evaluate(sanitized);
                if (!isFiniteResult(result)) {
                    throw new Error('결과가 유효하지 않습니다.');
                }

                const formattedResult = formatValue(result);
                lastResultRaw = result;
                lastResultExpression = prepareExpressionFromResult(result) || formattedResult;

                addHistoryEntry(expressionForHistory, formattedResult, lastResultExpression);

                expression = lastResultExpression;
                updateDisplay(false);
                resultDisplay.textContent = formattedResult;
                resultDisplay.classList.remove('preview');
            } catch (error) {
                resultDisplay.textContent = 'Error';
                resultDisplay.classList.remove('preview');
            }
        }

        function prepareExpressionFromResult(value) {
            const type = mathInstance.typeOf(value);
            if (type === 'number' || typeof value === 'number') {
                return Number(value).toString();
            }
            if (type === 'BigNumber') {
                return value.toString();
            }
            if (type === 'Fraction') {
                return (value.n / value.d).toString();
            }
            return '';
        }

        function isFiniteResult(value) {
            if (typeof value === 'number') {
                return Number.isFinite(value);
            }
            const type = mathInstance.typeOf(value);
            if (type === 'BigNumber') {
                return value.isFinite();
            }
            if (type === 'Fraction') {
                return true;
            }
            if (type === 'Complex') {
                return Number.isFinite(value.re) && Number.isFinite(value.im);
            }
            return true;
        }

        function formatValue(value) {
            const type = mathInstance.typeOf(value);
            if (type === 'number' || typeof value === 'number') {
                return mathInstance.format(Number(value), { precision: 12 });
            }
            if (type === 'BigNumber') {
                return mathInstance.format(value, { precision: 12 });
            }
            if (type === 'Fraction') {
                return mathInstance.format(value.n / value.d, { precision: 12 });
            }
            if (type === 'Complex') {
                const real = mathInstance.format(value.re, { precision: 10 });
                const imag = mathInstance.format(Math.abs(value.im), { precision: 10 });
                const sign = value.im >= 0 ? '+' : '−';
                return `${real} ${sign} ${imag}i`;
            }
            if (Array.isArray(value)) {
                return `[${value.map(formatValue).join(', ')}]`;
            }
            return value.toString();
        }

        function updateDisplay(showPreview = true) {
            expressionDisplay.textContent = expression || '0';
            updateMemoryIndicator();

            if (showPreview && expression) {
                try {
                    const sanitized = sanitizeExpression(expression);
                    const preview = mathInstance.evaluate(sanitized);
                    if (isFiniteResult(preview)) {
                        resultDisplay.textContent = formatValue(preview);
                        resultDisplay.classList.add('preview');
                        return;
                    }
                } catch (error) {
                    // 미리보기 계산 오류는 무시합니다.
                }
            }

            resultDisplay.textContent = formatValue(lastResultRaw);
            resultDisplay.classList.remove('preview');
        }

        function appendValue(value) {
            if (value === '.') {
                const numberMatch = expression.match(/(\d+\.?\d*)$/);
                if (!numberMatch) {
                    expression += '0.';
                } else if (numberMatch[0].includes('.')) {
                    return;
                } else {
                    expression += '.';
                }
                updateDisplay();
                return;
            }

            if (!expression && value === '0') {
                return;
            }

            if (shouldInsertMultiplication(value)) {
                expression += '*';
            }

            expression += value;
            updateDisplay();
        }

        function shouldInsertMultiplication(value) {
            if (!expression) return false;
            const implicitTargets = ['sin(', 'cos(', 'tan(', 'asin(', 'acos(', 'atan(', 'log(', 'ln(', 'sqrt(', 'cbrt(', 'abs(', 'exp(', 'rand()', 'rand(', 'pi', 'e', '('];
            const needsImplicit = implicitTargets.some((target) => {
                if (target.length === 1) {
                    return value === target;
                }
                return value.startsWith(target);
            });
            if (!needsImplicit) return false;
            if (/[+\-*/^,\s(]$/.test(expression)) return false;
            if (expression.endsWith('mod ')) return false;
            return true;
        }

        function handleAction(action) {
            switch (action) {
                case 'clear':
                    clearAll();
                    break;
                case 'delete':
                    deleteLast();
                    break;
                case 'evaluate':
                    evaluateExpression();
                    break;
                case 'toggle-sign':
                    toggleSign();
                    break;
                case 'square':
                    appendPower(2);
                    break;
                case 'cube':
                    appendPower(3);
                    break;
                case 'ten-power':
                    appendValue('10^(');
                    break;
                case 'reciprocal':
                    appendPower(-1);
                    break;
                case 'random':
                    appendValue('rand()');
                    break;
                case 'insert-ans':
                    if (lastResultExpression) {
                        appendValue(lastResultExpression);
                    }
                    break;
                case 'memory-clear':
                    memoryValue = 0;
                    updateMemoryIndicator();
                    break;
                case 'memory-store':
                    storeMemory();
                    break;
                case 'memory-recall':
                    appendValue(memoryValue.toString());
                    break;
                case 'memory-add':
                    adjustMemory(1);
                    break;
                case 'memory-subtract':
                    adjustMemory(-1);
                    break;
                default:
                    break;
            }
        }

        function clearAll() {
            expression = '';
            updateDisplay(false);
        }

        function deleteLast() {
            if (!expression) return;
            const functions = ['rand()', 'asin(', 'acos(', 'atan(', 'sin(', 'cos(', 'tan(', 'log(', 'ln(', 'sqrt(', 'cbrt(', 'abs(', 'exp(', 'rand(', 'neg(', 'inv('];
            const tokens = ['pi'];
            for (const fn of functions) {
                if (expression.endsWith(fn)) {
                    expression = expression.slice(0, -fn.length);
                    updateDisplay();
                    return;
                }
            }
            for (const token of tokens) {
                if (expression.endsWith(token)) {
                    expression = expression.slice(0, -token.length);
                    updateDisplay();
                    return;
                }
            }
            expression = expression.slice(0, -1);
            updateDisplay();
        }

        function toggleSign() {
            if (!expression) {
                const base = lastResultExpression || '0';
                expression = `neg(${base})`;
                updateDisplay();
                return;
            }

            if (expression.startsWith('neg(') && expression.endsWith(')') && isBalanced(expression.slice(4, -1))) {
                expression = expression.slice(4, -1);
            } else {
                expression = `neg(${expression})`;
            }
            updateDisplay();
        }

        function appendPower(power) {
            if (!expression) return;
            if (/\s$/.test(expression)) {
                expression = expression.trimEnd();
            }
            if (power === -1) {
                expression += '^-1';
            } else {
                expression += `^${power}`;
            }
            updateDisplay();
        }

        function storeMemory() {
            const value = getEvaluatedValue();
            if (value !== null) {
                memoryValue = value;
                updateMemoryIndicator();
            }
        }

        function adjustMemory(direction) {
            const value = getEvaluatedValue();
            if (value !== null) {
                memoryValue += direction * value;
                updateMemoryIndicator();
            }
        }

        function getEvaluatedValue() {
            if (expression) {
                try {
                    const sanitized = sanitizeExpression(expression);
                    const evaluated = mathInstance.evaluate(sanitized);
                    const numeric = toNumeric(evaluated);
                    if (numeric !== null) {
                        return numeric;
                    }
                } catch (error) {
                    // 유효하지 않은 중간 수식은 무시합니다.
                }
            }
            const numeric = toNumeric(lastResultRaw);
            return numeric !== null ? numeric : 0;
        }

        function toNumeric(value) {
            if (typeof value === 'number') {
                return Number.isFinite(value) ? value : null;
            }
            const type = mathInstance.typeOf(value);
            if (type === 'BigNumber') {
                return value.toNumber();
            }
            if (type === 'Fraction') {
                return value.n / value.d;
            }
            return null;
        }

        function updateMemoryIndicator() {
            const hasMemory = Math.abs(memoryValue) > 1e-12;
            memoryIndicator.classList.toggle('active', hasMemory);
        }

        function addHistoryEntry(expressionText, resultText, reusableExpression) {
            historyEntries.push({ expression: expressionText, result: resultText, reusableExpression });
            if (historyEntries.length > 12) {
                historyEntries = historyEntries.slice(historyEntries.length - 12);
            }
            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            const entries = [...historyEntries].reverse();
            for (const entry of entries) {
                const li = document.createElement('li');
                li.className = 'history-entry';
                const button = document.createElement('button');
                button.type = 'button';
                const exprSpan = document.createElement('span');
                exprSpan.className = 'history-expression';
                exprSpan.textContent = entry.expression;
                const resultSpan = document.createElement('span');
                resultSpan.className = 'history-result';
                resultSpan.textContent = entry.result;
                button.appendChild(exprSpan);
                button.appendChild(resultSpan);
                button.addEventListener('click', () => {
                    expression = entry.reusableExpression || entry.expression;
                    updateDisplay();
                });
                li.appendChild(button);
                historyList.appendChild(li);
            }
        }

        clearHistoryButton.addEventListener('click', () => {
            historyEntries = [];
            renderHistory();
        });

        angleToggle.addEventListener('click', () => {
            angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
            angleToggle.textContent = `각도 단위: ${angleMode}`;
            angleToggle.setAttribute('aria-pressed', angleMode === 'RAD');
            registerCustomFunctions();
            updateDisplay();
        });

        document.querySelectorAll('button.calc-button').forEach((button) => {
            button.addEventListener('click', () => {
                const value = button.dataset.value;
                const action = button.dataset.action;
                if (value) {
                    if (value === 'mod') {
                        appendValue(' mod ');
                    } else {
                        appendValue(value);
                    }
                } else if (action) {
                    handleAction(action);
                }
            });
        });

        document.addEventListener('keydown', (event) => {
            if (event.defaultPrevented) return;
            const key = event.key;
            if (/^[0-9]$/.test(key)) {
                appendValue(key);
            } else if (["+", "-", "*", "/", "^", "%", ".", ",", "(", ")"].includes(key)) {
                appendValue(key);
            } else if (key === 'Enter' || key === '=') {
                evaluateExpression();
                event.preventDefault();
            } else if (key === 'Backspace') {
                deleteLast();
                event.preventDefault();
            } else if (key === 'Escape') {
                clearAll();
                event.preventDefault();
            }
        });

        function isBalanced(str) {
            let depth = 0;
            for (const char of str) {
                if (char === '(') depth += 1;
                if (char === ')') {
                    depth -= 1;
                    if (depth < 0) return false;
                }
            }
            return depth === 0;
        }

        // 초기 렌더링
        updateDisplay(false);
        renderHistory();
    </script>
</body>
</html>
