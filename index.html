<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 홈페이지</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter 폰트 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Inter 폰트 적용 */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-8">
        <header class="text-center">
            <!-- 사용자 이름 및 타이틀 -->
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900 mb-2">
                <span id="userName" class="text-blue-600"></span>
            </h1>
            <p id="userTitle" class="text-md sm:text-lg text-gray-600"></p>
        </header>

        <!-- 핵심 기능 버튼 섹션 -->
        <section class="grid grid-cols-2 gap-4" id="featureButtons">
        </section>

        <!-- 소개/문의 정보 섹션 -->
        <section class="text-center bg-blue-50 p-4 rounded-xl">
            <p class="text-gray-700 text-sm sm:text-base leading-relaxed">
                AI 기술로 더 좋은 세상이 열리길 바랍니다. swkim777@gmail.com
            </p>
        </section>

        <!-- 최신 활동 섹션: 블로그 게시물 2개와 프로젝트 1개를 표시하도록 수정 -->
        <section class="space-y-4">
            <h2 class="text-xl font-semibold text-gray-800">최신 활동</h2>
            <!-- 최신 블로그 게시물 1 -->
            <div class="bg-gray-50 p-4 rounded-xl shadow-sm">
                <h3 class="text-md font-medium text-gray-700 mb-1">최신 블로그 게시물 1</h3>
                <a id="latestPostLink1" href="#" class="text-blue-600 hover:underline text-sm sm:text-base"></a>
            </div>
            <!-- 최신 블로그 게시물 2 (새로 추가) -->
            <div class="bg-gray-50 p-4 rounded-xl shadow-sm">
                <h3 class="text-md font-medium text-gray-700 mb-1">최신 블로그 게시물 2</h3>
                <a id="latestPostLink2" href="#" class="text-blue-600 hover:underline text-sm sm:text-base"></a>
            </div>
            <!-- 새로운 프로젝트 -->
            <div class="bg-gray-50 p-4 rounded-xl shadow-sm">
                <h3 class="text-md font-medium text-gray-700 mb-1">새로운 프로젝트</h3>
                <a id="latestProjectLink" href="#" class="text-blue-600 hover:underline text-sm sm:text-base"></a>
            </div>
        </section>

        <!-- 소셜 미디어 링크 섹션 -->
        <footer class="text-center pt-4 border-t border-gray-100">
            <h2 class="text-lg font-semibold text-gray-800 mb-3">저를 만나보세요</h2>
            <div class="flex justify-center space-x-6" id="socialLinks">
            </div>
        </footer>
    </div>

    <script>
        // DOMContentLoaded 이벤트는 HTML 문서가 완전히 로드되고 파싱되었을 때 발생합니다.
        // 이 시점에 DOM 조작을 시작하는 것이 안전합니다.
        document.addEventListener('DOMContentLoaded', () => {
            // 사용자 정보 (예시 데이터)
            const userName = "Jowon Home";
            const userTitle = "AI & Cloud Architector";
            
            // 두 개의 최신 게시물 데이터를 별도 변수로 정의했습니다.
            const latestPost1 = { 
                title: "타로점치기",
                link: "https://ai.studio/apps/drive/1eUpCxk2nCV7XTXiTBJoF7gKqCNMv2USd"
            };

            const latestPost2 = { 
                title: "Space Runner",
                link: "https://aistudio.google.com/apps/bundled/gemini_runner?showPreview=true&showAssistant=true"
            };
            
            const latestProject = {
                name: "스마트 팩토리 AI 예측 시스템",
                link: "#" // 실제 프로젝트 상세 페이지 링크로 변경
            };

            // 환영 메시지 및 이름 업데이트
            document.getElementById('userName').textContent = userName;
            document.getElementById('userTitle').textContent = userTitle;

            // 핵심 기능 버튼 데이터
            const featureButtonsData = [
                { icon: "O", text: "OpenAI", link: "openai/index.html" },
                { icon: "G", text: "Google", link: "google/index.html" },
                { icon: "📚", text: "포트폴리오", link: "port.html" },
                { icon: "💡", text: "계산기", link: "calc.html" },
                { icon: "📝", text: "Home", link: "myhub/index.html" },
                { icon: "🤖", text: "AI 강의", link: "https://bit.ly/4ep80p9" }, // AI 강의 링크를 변경
                { icon: "🔬", text: "H&O Biosis", link: "HnO/index.html" }, // HnO 정보 버튼 추가
                { icon: "📈", text: "Korea 2025", link: "korea2025.html" } // Korea 버튼 추가    
            ];

            // 핵심 기능 버튼 생성 함수
            function createButton(icon, text, link) {
                const a = document.createElement('a');
                a.href = link;
                // 버튼 색깔을 초록색 계통으로 변경 (bg-green-500, hover:bg-green-600)
                a.className = "flex flex-col items-center justify-center p-4 bg-green-500 text-white rounded-xl shadow-md hover:bg-green-600 transition-all duration-300 transform hover:scale-105";
                a.innerHTML = `<span class="text-3xl mb-2">${icon}</span><span class="text-base font-medium">${text}</span>`;
                return a;
            }

            // 핵심 기능 버튼들을 DOM에 추가
            const featureButtonsContainer = document.getElementById('featureButtons');
            featureButtonsData.forEach(button => {
                featureButtonsContainer.appendChild(createButton(button.icon, button.text, button.link));
            });

            // 최신 업데이트/활동 링크 업데이트
            // 첫 번째 최신 블로그 게시물 링크 업데이트
            const latestPostLink1 = document.getElementById('latestPostLink1');
            latestPostLink1.textContent = latestPost1.title;
            latestPostLink1.href = latestPost1.link;

            // 두 번째 최신 블로그 게시물 링크 업데이트 (새로 추가)
            const latestPostLink2 = document.getElementById('latestPostLink2');
            latestPostLink2.textContent = latestPost2.title;
            latestPost2.href = latestPost2.link;


            const latestProjectLink = document.getElementById('latestProjectLink');
            latestProjectLink.textContent = latestProject.name;
            latestProjectLink.href = latestProject.link;

            // 소셜 미디어 링크 데이터
            const socialLinksData = [
                { icon: "🔗", text: "GitHub", link: "https://github.com/swkim777" },
                // Notion 아이콘을 이미지로 변경하고 크기 조정
                { icon: '<img src="https://placehold.co/24x24/000000/ffffff?text=N" alt="Notion Icon" class="w-6 h-6">', text: "Notion", link: "https://notion.so/swkim777" },
                { icon: "📧", text: "Email", link: "mailto:swkim777@gmail.com" }
            ];

            // 소셜 미디어 링크 생성 함수
            function createSocialLink(icon, text, link) {
                const a = document.createElement('a');
                a.href = link;
                a.target = "_blank"; // 새 탭에서 열기
                a.rel = "noopener noreferrer"; // 보안을 위한 설정
                a.className = "flex flex-col items-center text-gray-600 hover:text-blue-600 transition-colors duration-200";
                // 아이콘 컨테이너에 고정된 크기와 중앙 정렬 적용
                // 이모지 아이콘의 경우 text-2xl을 적용하여 24x24px 크기를 유지
                const iconHtml = `<span class="w-6 h-6 flex items-center justify-center mb-1">${icon.startsWith('<img') ? icon : `<span class="text-2xl">${icon}</span>`}</span>`;
                // 텍스트를 bold 체로 변경 (font-bold 추가)
                a.innerHTML = `${iconHtml}<span class="text-xs font-bold">${text}</span>`;
                return a;
            }

            // 소셜 미디어 링크들을 DOM에 추가
            const socialLinksContainer = document.getElementById('socialLinks');
            socialLinksData.forEach(link => {
                socialLinksContainer.appendChild(createSocialLink(link.icon, link.text, link.link));
            });
        });
    </script>
</body>
</html>
