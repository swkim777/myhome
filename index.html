<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jowon Home - Interactive Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f8fafc; /* Slate 50 */
        }
        /* Custom Scrollbar for sleek look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Chart Container Specifics */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: 300px;
            max-height: 400px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 350px;
            }
        }

        .nav-item.active {
            background-color: #eff6ff; /* blue-50 */
            color: #2563eb; /* blue-600 */
            border-right: 3px solid #2563eb;
        }
    </style>
    <!-- Chosen Palette: Slate (Neutral Background) + Blue (Primary Action) + Green (Success/Buttons from Source) -->
    <!-- Application Structure Plan: 
         1. Layout: Two-column dashboard layout (Sidebar for Nav, Main Area for Content). Mobile-responsive (Sidebar becomes bottom nav or hamburger).
         2. Sections:
            - Overview: High-level summary, profile info, and a Chart.js visualization showing the distribution of the user's focus areas (AI, Utility, Work).
            - App Suite: A filterable grid of the functional buttons (OpenAI, Calc, etc.) allowing users to find tools by category.
            - Activities: A timeline/feed view of the blog posts and projects.
            - Connect: Social links and contact info presented as cards.
         3. Rationale: The original file was a long list. Grouping into a dashboard allows for a "Quick Glance" via charts and "Deep Dive" via specific tabs. 
    -->
    <!-- Visualization & Content Choices:
         1. Content Focus Chart (Overview): 
            - Goal: Inform the visitor about Jowon's primary expertise areas based on the links provided.
            - Visualization: Doughnut Chart (Chart.js).
            - Logic: Categorize links into 'AI', 'Utility', 'Profile', 'Work'.
            - Justification: Provides immediate visual context to the "AI & Cloud Architector" title.
         2. App Cards (App Suite):
            - Goal: Organize the scattered buttons into a clean, searchable interface.
            - Interaction: JS Filter by category (All, AI, Tools).
            - Justification: Improves findability as the list of tools grows.
         3. Activity Feed (Activities):
            - Goal: Present "Latest Activities" in a more engaging, chronological format.
            - Presentation: Vertical list with distinct styling for Projects vs Blog posts.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
</head>
<body class="text-slate-800 h-screen flex overflow-hidden selection:bg-blue-100">

    <!-- Sidebar Navigation (Desktop) / Mobile Menu Wrapper -->
    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 h-full shadow-sm z-10">

        <nav class="flex-1 overflow-y-auto py-4">

                        <span>최신 활동 (Activity)</span>
                    </button>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- Mobile Header -->
        <header class="md:hidden bg-white border-b border-slate-200 p-4 flex justify-between items-center z-20">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-white font-bold">J</div>
                <span class="font-bold text-slate-800">Jowon Home</span>

        <!-- Mobile Navigation Menu (Hidden by default) -->
        <div id="mobileNav" class="md:hidden absolute top-16 left-0 w-full bg-white shadow-xl border-b border-slate-200 hidden z-30 transition-all">
            <ul class="py-2">
                <li><button onclick="router.navigate('overview')" class="block w-full text-left px-6 py-3 text-slate-600 hover:bg-slate-50">📊 대시보드</button></li>
                <li><button onclick="router.navigate('apps')" class="block w-full text-left px-6 py-3 text-slate-600 hover:bg-slate-50">🚀 앱 & 도구</button></li>

        <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">

        </div>

    </main>

    <!-- Templates for Views to be injected via JS -->
    <template id="view-overview">
        <div class="max-w-5xl mx-auto space-y-8 animate-fade-in">
            <!-- Hero Section -->
            <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-100 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                <div>
                    <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold tracking-wide mb-2">PROFILE</span>
                    <h2 class="text-3xl font-bold text-slate-900 mb-2" id="profile-name">Loading...</h2>
                    <p class="text-lg text-slate-600 font-medium" id="profile-title">Loading...</p>
                    <p class="mt-4 text-slate-500 leading-relaxed max-w-2xl">
                        AI 기술로 더 좋은 세상이 열리길 바랍니다.<br>
                        이곳은 저의 프로젝트와 학습한 내용을 기록하고 공유하는 디지털 허브입니다.
                    </p>

            <!-- Analytics Section -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                    <div class="mb-4">
                        <h3 class="text-lg font-bold text-slate-800">관심 분야 분포 (Focus Area)</h3>
                        <p class="text-sm text-slate-500">제공된 앱 및 프로젝트의 기술 분류 분석</p>
                    </div>
                    <div class="chart-container">
                        <canvas id="skillsChart"></canvas>
                    </div>
                </div>

                <!-- Stats & Quick Actions -->
                <div class="space-y-6">
                    <!-- Stats Grid -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-blue-50 rounded-xl p-5 border border-blue-100">
                            <p class="text-blue-600 text-sm font-semibold mb-1">Total Apps</p>

                    <!-- Recent Highlight -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex-1">
                        <h3 class="text-lg font-bold text-slate-800 mb-3">🌟 추천 프로젝트</h3>
                        <div id="featured-project-container">
                            <!-- JS injected -->
                        </div>

                </div>
            </div>
        </div>
    </template>

                    <button class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors whitespace-nowrap" data-filter="AI">🤖 AI Tools</button>

                    <button class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors whitespace-nowrap" data-filter="Profile">👤 Profile</button>
                    <button class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors whitespace-nowrap" data-filter="Game">🎮 Game</button>
                </div>

            <!-- Grid Container -->

    <template id="view-activities">
        <div class="max-w-3xl mx-auto space-y-8 animate-fade-in">
            <div class="text-center mb-8">

                <p class="text-slate-500">최신 블로그 포스팅과 프로젝트 업데이트 내역입니다.</p>

            <div class="relative border-l-2 border-slate-200 ml-4 space-y-8 pb-8" id="activity-timeline">

    <template id="view-connect">
        <div class="max-w-4xl mx-auto flex flex-col items-center justify-center min-h-[60vh] space-y-8 animate-fade-in">
            <div class="text-center space-y-2">
                <h2 class="text-3xl font-bold text-slate-900">Get in Touch</h2>
                <p class="text-slate-500">협업 제안이나 문의사항은 언제든 환영합니다.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                <!-- Social Cards injected via JS -->

            <div class="bg-blue-50 p-6 rounded-xl text-center w-full max-w-md">
                <p class="text-sm text-blue-800 font-medium mb-1">Direct Email</p>
                <a href="mailto:swkim777@gmail.com" class="text-lg font-bold text-blue-600 hover:underline">swkim777@gmail.com</a>
            </div>
        </div>
    </template>

    <!-- JavaScript Logic -->
    <script>
        // Data Store (Extracted & Enhanced from Source)
        const appData = {
            user: {
                name: "Jowon Home",
                title: "AI & Cloud Architector",
                email: "swkim777@gmail.com"
            },
            // Categorized links for better structure
            features: [
                { id: 1, name: "OpenAI", category: "AI", icon: "🤖", link: "openai/index.html", desc: "AI 모델 탐색 및 실험" },
                { id: 2, name: "Google", category: "Utility", icon: "🌐", link: "google/index.html", desc: "검색 및 리소스" },
                { id: 3, name: "Portfolio", category: "Profile", icon: "📂", link: "port.html", desc: "경력 및 프로젝트 모음" },
                { id: 4, name: "계산기", category: "Utility", icon: "🧮", link: "calc.html", desc: "웹 기반 계산 도구" },
                { id: 5, name: "Home", category: "Profile", icon: "🏠", link: "myhub/index.html", desc: "메인 허브로 이동" },
                { id: 6, name: "Audio Editor", category: "Utility", icon: "🎵", link: "audio/index.html", desc: "오디오 편집 및 처리" },
                { id: 7, name: "H&O Biosis", category: "Work", icon: "🏢", link: "HnO/index.html", desc: "기업 페이지 바로가기" },
                { id: 8, name: "Image Extractor", category: "AI", icon: "🖼️", link: "ImageExtract/index.html", desc: "이미지 데이터 추출 도구" },
                { id: 9, name: "주식", category: "Utility", icon: "📈", link: "stock/index.html", desc: "주식 정보 및 차트 확인" },
                { id: 10, name: "주식 뉴스", category: "Utility", icon: "📰", link: "StockNews/index.html", desc: "최신 주식 뉴스 확인" },
                { id: 11, name: "테트리스", category: "Game", icon: "🕹️", link: "tetris/index.html", desc: "추억의 테트리스 게임" },
                { id: 12, name: "Blog", category: "Profile", icon: "✍️", link: "BlogPage/index.html", desc: "개인 블로그 및 생각 정리" },
                { id: 13, name: "너구리", category: "Game", icon: "🦝", link: "racoon/index.html", desc: "추억의 레트로 너구리 게임" }
            ],
            activities: [
                { type: "Blog", title: "타로점치기", link: "https://ai.studio/apps/drive/1eUpCxk2nCV7XTXiTBJoF7gKqCNMv2USd", date: "New", desc: "AI를 활용한 운세 서비스" },
                { type: "Game", title: "Space Runner", link: "https://aistudio.google.com/apps/bundled/gemini_runner?showPreview=true&showAssistant=true", date: "New", desc: "Gemini 기반 웹 게임" },
                { type: "Tool", title: "Image Creater", link: "https://ai.studio/apps/drive/1sDeMsAPYLgn9Ehmf5bt3-0MfqAFHSpes", date: "Update", desc: "생성형 AI 이미지 툴" },
                { type: "Project", title: "스마트 팩토리 AI 예측 시스템", link: "#", date: "Featured", desc: "제조 공정 최적화 솔루션" }
            ],
            social: [
                { name: "GitHub", link: "https://github.com/swkim777", icon: "💻", color: "bg-gray-800" },
                { name: "Notion", link: "https://notion.so/swkim777", icon: "📓", color: "bg-slate-700" },
                { name: "Email", link: "mailto:swkim777@gmail.com", icon: "📧", color: "bg-blue-600" }
            ]
        };

        // Router & Navigation System
        const router = {
            currentRoute: 'overview',
            init: function() {
                this.navigate('overview');
                this.setupMobileMenu();
            },
            navigate: function(route) {
                this.currentRoute = route;
                
                // Update Nav UI
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.remove('active', 'bg-blue-50', 'text-blue-600');
                    if(el.id === `nav-${route}`) {
                        el.classList.add('active', 'bg-blue-50', 'text-blue-600');
                    }
                });

                // Hide Mobile Menu if open
                document.getElementById('mobileNav').classList.add('hidden');

                // Render View
                this.render(route);
            },
            render: function(route) {
                const contentArea = document.getElementById('content-area');
                const template = document.getElementById(`view-${route}`);
                
                if (!template) return;

                // Clear & Clone
                contentArea.innerHTML = '';
                const clone = template.content.cloneNode(true);
                contentArea.appendChild(clone);

                // Initialize View Specific Logic
                if (route === 'overview') views.overview();
                if (route === 'apps') views.apps();
                if (route === 'activities') views.activities();
                if (route === 'connect') views.connect();
            },
            setupMobileMenu: function() {
                const btn = document.getElementById('mobileMenuBtn');
                const menu = document.getElementById('mobileNav');
                btn.addEventListener('click', () => {
                    menu.classList.toggle('hidden');
                });
            }
        };

        // View Logic
        const views = {
            overview: function() {
                // Populate Profile
                document.getElementById('profile-name').textContent = appData.user.name;
                document.getElementById('profile-title').textContent = appData.user.title;
                document.getElementById('stat-apps').textContent = appData.features.length;
                document.getElementById('stat-projects').textContent = appData.activities.length;

                // Featured Project
                const featured = appData.activities.find(a => a.type === 'Project') || appData.activities[0];
                const featContainer = document.getElementById('featured-project-container');
                featContainer.innerHTML = `
                    <div class="border border-slate-200 rounded-xl p-4 hover:shadow-md transition-shadow cursor-pointer" onclick="window.open('${featured.link}', '_blank')">
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded">${featured.type}</span>
                            <span class="text-slate-400 text-xs">🔗 바로가기</span>
                        </div>
                        <h4 class="font-bold text-slate-800">${featured.title}</h4>
                        <p class="text-sm text-slate-500 mt-1">${featured.desc}</p>
                    </div>
                `;

                // Render Chart
                this.renderChart();
            },

            renderChart: function() {
                const ctx = document.getElementById('skillsChart').getContext('2d');
                
                // Calculate Distribution
                const distribution = {};
                appData.features.forEach(f => {
                    distribution[f.category] = (distribution[f.category] || 0) + 1;
                });

                // Prepare Data
                const labels = Object.keys(distribution);
                const data = Object.values(distribution);
                const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6']; // Tailwind blue-500, green-500, amber-500, violet-500

                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: colors,
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    usePointStyle: true,
                                    font: { family: "'Inter', sans-serif" }
                                }
                            }
                        },
                        cutout: '70%'
                    }
                });
            },

            apps: function() {
                const grid = document.getElementById('apps-grid');
                const filters = document.querySelectorAll('.filter-btn');

                // Render Function
                const renderCards = (filter) => {
                    grid.innerHTML = '';
                    appData.features.forEach(app => {
                        if (filter === 'all' || app.category === filter) {
                            const card = document.createElement('a');
                            card.href = app.link;
                            card.className = "group block bg-white rounded-xl p-6 border border-slate-200 hover:border-green-400 hover:shadow-md transition-all duration-300 relative overflow-hidden";
                            card.innerHTML = `
                                <div class="absolute top-0 left-0 w-1 h-full bg-slate-200 group-hover:bg-green-500 transition-colors"></div>
                                <div class="flex items-start justify-between mb-4 pl-2">
                                    <span class="text-4xl filter grayscale group-hover:grayscale-0 transition-all">${app.icon}</span>
                                    <span class="text-xs font-semibold text-slate-400 bg-slate-50 px-2 py-1 rounded border border-slate-100">${app.category}</span>
                                </div>
                                <h3 class="font-bold text-lg text-slate-800 group-hover:text-green-600 transition-colors pl-2">${app.name}</h3>
                                <p class="text-sm text-slate-500 mt-2 pl-2">${app.desc}</p>
                            `;
                            grid.appendChild(card);
                        }
                    });
                };

                // Initial Render
                renderCards('all');

                // Filter Logic
                filters.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        // UI Update
                        filters.forEach(b => {
                            b.classList.remove('bg-slate-800', 'text-white');
                            b.classList.add('bg-white', 'text-slate-600');
                        });
                        e.target.classList.remove('bg-white', 'text-slate-600');
                        e.target.classList.add('bg-slate-800', 'text-white');

                        // Data Update
                        renderCards(e.target.dataset.filter);
                    });
                });
                
                // Set initial active state manually for visual consistency
                filters[0].classList.remove('bg-white', 'text-slate-600');
                filters[0].classList.add('bg-slate-800', 'text-white');
            },

            activities: function() {
                const container = document.getElementById('activity-timeline');
                appData.activities.forEach((act, index) => {
                    const item = document.createElement('div');
                    item.className = "relative pl-8";
                    
                    // Icon logic
                    let iconColor = act.type === 'Project' ? 'bg-purple-500' : 'bg-blue-500';
                    
                    item.innerHTML = `
                        <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full border-2 border-white ${iconColor} shadow-sm"></div>
                        <div class="bg-white p-5 rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">${act.type}</span>
                                <span class="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full font-medium">${act.date}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-1">
                                <a href="${act.link}" class="hover:text-blue-600 transition-colors">${act.title}</a>
                            </h3>
                            <p class="text-sm text-slate-500 mb-3">${act.desc}</p>
                            <a href="${act.link}" class="text-sm font-medium text-blue-600 hover:text-blue-800 inline-flex items-center">
                                자세히 보기 &rarr;
                            </a>
                        </div>
                    `;
                    container.appendChild(item);
                });
            },

            connect: function() {
                const container = document.getElementById('connect-cards');
                appData.social.forEach(s => {
                    const card = document.createElement('a');
                    card.href = s.link;
                    card.target = "_blank";
                    card.className = `${s.color} text-white p-6 rounded-xl shadow-lg hover:opacity-90 transition-opacity flex flex-col items-center justify-center space-y-3 transform hover:-translate-y-1 duration-300`;
                    card.innerHTML = `
                        <span class="text-4xl">${s.icon}</span>
                        <span class="font-bold text-lg">${s.name}</span>
                        <span class="text-xs opacity-75 bg-white/20 px-3 py-1 rounded-full">Connect</span>
                    `;
                    container.appendChild(card);
                });
            }
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            router.init();
        });

    </script>
</body>
</html>
