<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Photo Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-8 text-slate-900">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800 mb-2 flex items-center justify-center gap-2">
                <i data-lucide="wand-2" class="text-blue-600"></i> Gemini AI Photo Editor
            </h1>
            <p class="text-slate-500 text-sm">사진을 업로드하고 AI 명령어를 입력해 분위기를 바꿔보세요.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i data-lucide="image" class="text-blue-500"></i> 원본 및 프롬프트
                    </h2>
                    
                    <div id="dropzone" class="relative group border-2 border-dashed border-slate-300 rounded-xl overflow-hidden bg-slate-50 transition-colors hover:border-blue-400 cursor-pointer">
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                        <div id="uploadPlaceholder" class="flex flex-col items-center justify-center py-12">
                            <i data-lucide="upload" class="text-slate-400 mb-2" style="width: 32px; height: 32px;"></i>
                            <span class="text-slate-500 text-sm font-medium">사진 업로드 클릭</span>
                        </div>
                        <div id="imagePreview" class="hidden relative aspect-video">
                            <img id="sourceImg" class="w-full h-full object-contain">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-white">
                                <i data-lucide="upload" class="mr-2"></i> 사진 변경
                            </div>
                        </div>
                    </div>

                    <div class="mt-6">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">상세 명령어 (Prompt)</label>
                        <textarea id="promptArea" placeholder="이미지에서 변경하고 싶은 내용을 입력하세요..." 
                            class="w-full h-24 p-4 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm"></textarea>
                    </div>

                    <div class="mt-4">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Gemini API Key</label>
                        <input type="password" id="apiKeyInput" placeholder="API 키를 입력하세요" 
                            class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                    </div>

                    <button id="generateBtn" class="w-full mt-6 py-3.5 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="wand-2"></i> AI 편집 시작
                    </button>
                </div>
            </div>

            <div class="lg:col-span-5 flex flex-col">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex-grow flex flex-col min-h-[500px]">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i data-lucide="sparkles" class="text-purple-500"></i> 편집 결과
                    </h2>
                    <div id="resultContainer" class="flex-grow border border-slate-200 rounded-xl bg-slate-100 flex items-center justify-center overflow-hidden relative">
                        <div id="resultPlaceholder" class="text-center text-slate-400">
                            <i data-lucide="image" class="mx-auto mb-2 opacity-20" style="width: 48px; height: 48px;"></i>
                            <p class="text-sm italic">결과물이 여기에 표시됩니다.</p>
                        </div>
                        <div id="loadingOverlay" class="hidden text-center">
                            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4 mx-auto"></div>
                            <p class="text-sm text-blue-600 font-medium">AI가 이미지를 생성 중입니다...</p>
                        </div>
                        <div id="resultImageWrapper" class="hidden p-4 flex flex-col items-center gap-4">
                            <img id="resultImg" class="max-w-full max-h-[400px] object-contain rounded-lg shadow-xl">
                            <div class="flex gap-2">
                                <a id="downloadBtn" href="#" download="edited_image.png" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-bold flex items-center gap-1">
                                    <i data-lucide="download" style="width: 14px; height: 14px;"></i> 저장
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 초기 설정
        lucide.createIcons();
        
        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const sourceImg = document.getElementById('sourceImg');
        const promptArea = document.getElementById('promptArea');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultImg = document.getElementById('resultImg');
        
        let base64Source = "";

        // 이미지 업로드 로직
        dropzone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    sourceImg.src = event.target.result;
                    base64Source = event.target.result.split(',')[1];
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('imagePreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        // 이미지 편집 실행
        generateBtn.onclick = async () => {
            const apiKey = apiKeyInput.value.trim();
            const prompt = promptArea.value.trim();

            if (!base64Source || !prompt || !apiKey) {
                alert("사진, 명령어, API 키를 모두 입력해주세요.");
                return;
            }

            // UI 상태 변경 (로딩 중)
            toggleLoading(true);

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: "image/png", data: base64Source } }
                        ]
                    }],
                    generationConfig: { responseModalities: ["IMAGE"] }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const generatedBase64 = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

                if (generatedBase64) {
                    const resultUrl = `data:image/png;base64,${generatedBase64}`;
                    resultImg.src = resultUrl;
                    document.getElementById('downloadBtn').href = resultUrl;
                    showResult(true);
                } else {
                    throw new Error("이미지 데이터가 없습니다.");
                }
            } catch (err) {
                alert("오류가 발생했습니다: " + err.message);
            } finally {
                toggleLoading(false);
            }
        };

        function toggleLoading(isLoading) {
            document.getElementById('resultPlaceholder').classList.toggle('hidden', isLoading);
            document.getElementById('loadingOverlay').classList.toggle('hidden', !isLoading);
            document.getElementById('resultImageWrapper').classList.add('hidden');
            generateBtn.disabled = isLoading;
            generateBtn.innerText = isLoading ? "AI 작업 중..." : "AI 편집 시작";
        }

        function showResult(isSuccess) {
            document.getElementById('resultPlaceholder').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('resultImageWrapper').classList.remove('hidden');
        }
    </script>
</body>
</html>
