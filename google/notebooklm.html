<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM 고객센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .accordion-content {
            display: none;
            transition: max-height 0.3s ease-in-out;
            overflow: hidden;
        }
        .accordion-button.open svg {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto max-w-4xl p-4 sm:p-6 lg:p-8">
        <!-- Header Section -->
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-blue-600 mb-2">NotebookLM 고객센터</h1>
            <p class="text-lg text-gray-600">Google의 AI 기반 연구 및 글쓰기 파트너, NotebookLM에 대해 무엇이든 물어보세요.</p>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Browse by Topic -->
            <section class="mb-12">
                <h2 class="text-2xl font-semibold border-b-2 border-blue-200 pb-2 mb-6">주제별로 둘러보기</h2>
                <div class="space-y-4" id="accordion-container">
                    <!-- Accordion items will be injected here by JavaScript -->
                </div>
            </section>
            
            <!-- Need more help? -->
            <section class="text-center bg-white p-8 rounded-lg shadow">
                <h2 class="text-2xl font-semibold mb-4">도움이 더 필요하신가요?</h2>
                <p class="text-gray-600 mb-6">커뮤니티에서 질문에 대한 답변을 찾아보세요.</p>
                <a href="https://support.google.com/notebooklm/community" target="_blank" class="inline-block bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors duration-300">
                    NotebookLM 도움말 커뮤니티 방문하기
                </a>
            </section>
        </main>

        <!-- Footer -->
        <footer class="text-center mt-12 py-4 border-t">
            <p class="text-gray-500 text-sm">&copy; 2024 Google LLC</p>
        </footer>
    </div>

    <script>
        const topics = [
            {
                category: 'NotebookLM 소개',
                items: [
                    {
                        title: 'NotebookLM이란 무엇인가요?',
                        content: `NotebookLM은 사용자가 직접 선택한 소스 자료를 기반으로 하는 AI 기반 연구 및 글쓰기 파트너입니다. NotebookLM을 사용하면 복잡한 문서를 더 빠르게 이해하고, 다양한 정보 간의 연관성을 찾고, 초안을 더 빨리 작성할 수 있습니다.<br><br><strong>주요 기능:</strong><br>- <strong>질문하기:</strong> 업로드한 소스에 대해 질문하고 답변을 얻으세요.<br>- <strong>아이디어 브레인스토밍:</strong> 창의적인 아이디어를 탐색하고 새로운 관점을 발견하세요.<br>- <strong>콘텐츠 요약:</strong> 긴 문서를 핵심 내용만 요약하여 빠르게 파악하세요.<br>- <strong>글쓰기 지원:</strong> 이메일, 스크립트, 보고서 등 다양한 형식의 초안을 작성하세요.`
                    },
                    {
                        title: 'NotebookLM의 작동 방식',
                        content: `NotebookLM은 사용자가 제공하는 소스를 기반으로 답변을 생성합니다. Google Drive 문서, PDF, 텍스트 파일, 복사한 텍스트, 웹사이트 URL 등 다양한 소스를 추가할 수 있습니다. NotebookLM은 이 소스들을 바탕으로 언어 모델을 '접지(grounding)'하여, 인터넷의 모든 정보가 아닌 사용자가 제공한 자료에만 기반한 답변을 생성합니다. 따라서 더 정확하고 관련성 높은 결과를 얻을 수 있습니다.`
                    }
                ]
            },
            {
                category: '시작하기',
                items: [
                    {
                        title: 'NotebookLM 사용 시작하기',
                        content: `NotebookLM을 시작하는 방법은 간단합니다.<br>1. notebooklm.google.com으로 이동합니다.<br>2. Google 계정으로 로그인합니다.<br>3. 새 노트북을 만들거나 기존 노트북을 엽니다.<br>4. '+ 소스 추가'를 클릭하여 Google Drive, PDF, 텍스트 파일 등 원하는 소스를 추가합니다.<br>5. 하단의 입력창에 소스에 대한 질문이나 요청사항을 입력하고 AI의 답변을 확인합니다.`
                    },
                    {
                        title: '지원되는 언어 및 국가',
                        content: `NotebookLM은 현재 180개 이상의 국가 및 지역에서 영어로 제공됩니다. 더 많은 언어와 국가를 지원하기 위해 노력하고 있습니다.`
                    }
                ]
            },
            {
                category: '소스 작업',
                items: [
                    {
                        title: '다양한 소스 추가하기',
                        content: `NotebookLM에서는 다음과 같은 다양한 유형의 소스를 추가할 수 있습니다.<br>- <strong>Google Drive:</strong> Google 문서, 슬라이드, PDF 등<br>- <strong>파일 업로드:</strong> PDF, 텍스트(.txt) 파일<br>- <strong>텍스트 붙여넣기</strong><br>- <strong>웹사이트 URL</strong><br><br>각 노트북에는 최대 50개의 소스를 추가할 수 있으며, 소스당 단어 수는 50만 단어로 제한됩니다.`
                    },
                    {
                        title: '소스에 대해 질문하기',
                        content: `소스를 추가한 후에는 대화창을 통해 소스에 대해 질문할 수 있습니다. 예를 들어, "이 보고서의 주요 결과를 요약해 줘" 또는 "두 소스의 주장을 비교해 줘"와 같이 구체적으로 질문할 수 있습니다. NotebookLM은 추가된 소스의 내용을 바탕으로 답변과 함께 관련 인용 정보를 제공합니다.`
                    },
                    {
                        title: '소스 관리 (이름 바꾸기/삭제)',
                        content: `소스 패널에서 각 소스 옆에 있는 점 3개 메뉴를 클릭하여 소스 이름을 바꾸거나 소스를 삭제할 수 있습니다. 소스를 삭제하면 해당 소스와 관련된 대화 내용도 일부 영향을 받을 수 있습니다.`
                    }
                ]
            },
            {
                category: '답변 생성 및 기능',
                items: [
                    {
                        title: '소스 요약 보기',
                        content: `소스 중 하나를 선택한 후 대화창에 "이 문서를 요약해 줘"라고 입력하면 NotebookLM이 핵심 내용을 요약해 줍니다. 긴 문서를 빠르게 파악하는 데 유용합니다.`
                    },
                    {
                        title: '소스 가이드 보기',
                        content: `NotebookLM은 추가한 소스를 바탕으로 학습 가이드, 브리핑 문서, 목차 등 유용한 자료를 자동으로 생성할 수 있습니다. "이 소스들로 학습 가이드를 만들어 줘"와 같이 요청해 보세요.`
                    },
                    {
                        title: '자주 묻는 질문(FAQ) 생성',
                        content: `인터뷰 스크립트나 제품 설명서 같은 소스를 추가하고 "이 내용으로 예상 FAQ 목록을 만들어 줘"라고 요청하면, NotebookLM이 예상 질문과 답변 목록을 생성해 줍니다.`
                    },
                    {
                        title: 'NotebookLM의 인용 정보',
                        content: `NotebookLM이 생성하는 모든 답변에는 인용 정보가 포함됩니다. 답변 옆에 표시되는 숫자를 클릭하면 해당 내용이 어떤 소스의 어느 부분에서 왔는지 직접 확인할 수 있어, 정보의 신뢰성을 쉽게 검증할 수 있습니다.`
                    }
                ]
            },
            {
                category: '공유, 내보내기, 삭제',
                items: [
                    {
                        title: 'NotebookLM에서 대화 기록 삭제하기',
                        content: `노트북 내의 대화 기록을 삭제하려면, 우측 상단의 메뉴를 열고 '대화 기록 삭제'를 선택하세요. 이 작업은 소스는 그대로 유지한 채 대화 내용만 초기화합니다.`
                    },
                    {
                        title: '노트북 공유 및 공동작업하기',
                        content: `(현재 일부 사용자에게 테스트 중인 기능일 수 있습니다) 노트북을 다른 사람과 공유하여 함께 작업할 수 있습니다. '공유' 버튼을 클릭하고 공동작업자의 이메일을 추가한 후, '뷰어' 또는 '편집자' 권한을 설정하세요.`
                    },
                    {
                        title: 'NotebookLM에서 내 데이터 내보내기',
                        content: `작성한 노트나 AI와의 대화 내용을 내보낼 수 있습니다. 메뉴에서 '내보내기'를 선택하면 Google Docs로 보내거나 텍스트 파일(.txt)로 다운로드할 수 있는 옵션이 제공됩니다.`
                    }
                ]
            },
            {
                category: '개인 정보 보호 및 데이터',
                items: [
                    {
                        title: 'NotebookLM 개인 정보 보호 허브',
                        content: `Google은 사용자의 개인정보를 중요하게 생각합니다. NotebookLM은 사용자가 제공한 소스 데이터를 모델 학습에 사용하지 않습니다. 사용자의 데이터는 Google 계정과 함께 안전하게 보관되며, 사용자가 직접 삭제하지 않는 한 유지됩니다.`
                    },
                    {
                        title: 'NotebookLM 활동 관리 및 삭제하기',
                        content: `NotebookLM 활동은 myactivity.google.com에서 확인하고 관리할 수 있습니다. 특정 활동을 삭제하거나 자동 삭제를 설정할 수 있습니다. 노트북이나 대화 기록을 삭제하고 싶다면 NotebookLM 인터페이스 내에서 직접 삭제할 수 있습니다.`
                    },
                    {
                        title: '관련 정책 문서',
                        content: `NotebookLM 사용에는 Google의 정책이 적용됩니다.<br>- <strong>서비스 약관:</strong> 서비스 사용에 대한 법적 합의입니다.<br>- <strong>개인정보처리방침:</strong> Google이 사용자의 데이터를 어떻게 수집하고 사용하는지 설명합니다.<br>- <strong>금지된 사용 정책:</strong> 서비스의 오용을 방지하기 위한 규칙을 명시합니다.`
                    }
                ]
            }
        ];

        const container = document.getElementById('accordion-container');

        topics.forEach(topic => {
            const categoryTitle = document.createElement('h3');
            categoryTitle.className = 'text-xl font-semibold text-gray-700 mt-8 mb-3';
            categoryTitle.textContent = topic.category;
            container.appendChild(categoryTitle);

            topic.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bg-white rounded-lg shadow-sm';
                
                const button = document.createElement('button');
                button.className = 'accordion-button w-full flex justify-between items-center text-left p-4 font-medium text-gray-800 hover:bg-gray-100';
                button.innerHTML = `
                    <span>${item.title}</span>
                    <svg class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                `;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'accordion-content';
                contentDiv.innerHTML = `<div class="p-4 border-t border-gray-200 text-gray-600">${item.content}</div>`;
                
                itemDiv.appendChild(button);
                itemDiv.appendChild(contentDiv);
                container.appendChild(itemDiv);

                button.addEventListener('click', () => {
                    const isOpen = button.classList.toggle('open');
                    if (isOpen) {
                        contentDiv.style.display = 'block';
                    } else {
                        contentDiv.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
