<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Developer Portfolio</title>
  <meta name="description" content="Personal Portfolio Web App built with Antigravity">
  <link rel="icon" type="image/jpeg" href="assets/profile.jpg">
  <meta property="og:image" content="assets/profile.jpg">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-24 md:pb-12 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Floating Header -->
  <header class="sticky top-0 z-40 w-full glass-nav bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/80 dark:border-slate-800/80">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="#" class="font-extrabold text-base sm:text-lg tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
        PORTFOLIO.
      </a>
      <div class="flex items-center gap-2">
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600 dark:text-slate-300">
          <a href="#about" class="hover:text-indigo-600 dark:hover:text-indigo-400">About</a>
          <a href="#skills" class="hover:text-indigo-600 dark:hover:text-indigo-400">Skills</a>
          <a href="#projects" class="hover:text-indigo-600 dark:hover:text-indigo-400">Projects</a>
          <a href="#experience" class="hover:text-indigo-600 dark:hover:text-indigo-400">Experience</a>
        </nav>
        <!-- Dark Mode Toggle Button -->
        <button id="theme-toggle" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100/80 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700" aria-label="Toggle Theme">
          <span id="theme-icon"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 sm:pt-10 space-y-16 sm:space-y-20">

    <!-- Hero Section -->
    <section id="about" class="pt-4">
      <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-8">
        <div class="relative shrink-0">
          <img id="profile-avatar" src="assets/profile.jpg" alt="Profile Photo" class="w-28 h-28 sm:w-36 sm:h-36 rounded-full object-cover shadow-lg border-4 border-white dark:border-slate-800">
          <div class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 rounded-full border-2 border-white dark:border-slate-800"></div>
        </div>
        <div class="flex-1 text-center sm:text-left space-y-3">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800/70 text-emerald-700 dark:text-emerald-300 text-xs font-semibold">
            <span id="profile-status"></span>
          </div>
          <h1 id="profile-name" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight"></h1>
          <p id="profile-title" class="text-sm sm:text-base font-semibold text-indigo-600 dark:text-indigo-400"></p>
          <p id="profile-tagline" class="text-sm text-slate-600 dark:text-slate-300 font-medium"></p>
          <p id="profile-bio" class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 leading-relaxed pt-1"></p>
          
          <div class="flex items-center justify-center sm:justify-start gap-2 pt-2" id="social-links"></div>
        </div>
      </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="space-y-5">
      <div class="flex items-center gap-2">
        <i data-lucide="sparkles" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
        <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">Core Competencies</h2>
      </div>
      <div id="skills-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="space-y-5">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex items-center gap-2">
          <i data-lucide="layers" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
          <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">Featured Projects</h2>
        </div>
        <!-- Category Filter Tabs -->
        <div class="flex items-center gap-1.5 p-1 bg-slate-100 dark:bg-slate-800/90 rounded-xl border border-slate-200/80 dark:border-slate-700/60 overflow-x-auto text-xs font-medium">
          <button class="filter-btn px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-sm" data-category="all">All</button>
          <button class="filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300" data-category="ai">AI / Agent</button>
          <button class="filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300" data-category="web">Web App</button>
          <button class="filter-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300" data-category="cloud">Cloud / Ops</button>
        </div>
      </div>
      <div id="projects-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>

    <!-- Career Experience Section -->
    <section id="experience" class="space-y-5">
      <div class="flex items-center gap-2">
        <i data-lucide="briefcase" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
        <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">Experience & Career</h2>
      </div>
      <div class="p-6 rounded-2xl bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 shadow-sm">
        <div id="experience-timeline" class="space-y-2"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="pt-10 pb-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400">
      <p>© 2026 Built with Google Antigravity. Static Single Page Architecture.</p>
    </footer>

  </main>

  <!-- Mobile Bottom Floating Action Bar -->
  <div class="fixed bottom-0 left-0 right-0 p-3 z-50 md:hidden glass-nav bg-white/90 dark:bg-slate-900/90 border-t border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-2 max-w-sm mx-auto">
      <button class="copy-email-btn flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-md active:scale-95 transition-transform">
        <i data-lucide="mail" class="w-4 h-4"></i>
        <span>이메일 복사하기</span>
      </button>
      <a href="#about" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300" aria-label="맨 위로">
        <i data-lucide="arrow-up" class="w-4 h-4"></i>
      </a>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-16 md:bottom-8 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-xs font-semibold shadow-xl flex items-center gap-2">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400 dark:text-emerald-600"></i>
    <span>이메일 주소가 클립보드에 복사되었습니다!</span>
  </div>

  <!-- App Scripts -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
