    <style>
        body {

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Chart Container Specifics */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: 300px;
            max-height: 400px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 350px;
            }
        }

        .nav-item.active {
            background-color: #eff6ff; /* blue-50 */
            color: #2563eb; /* blue-600 */
            border-right: 3px solid #2563eb;
        }
        .subnav-item.active {
            background-color: #eff6ff; /* blue-50 */
            color: #2563eb; /* blue-600 */
            font-weight: 600;
        }

    <!-- Chosen Palette: Slate (Neutral Background) + Blue (Primary Action) + Green (Success/Buttons from Source) -->
    <!-- Application Structure Plan: 
         1. Layout: Two-column dashboard layout (Sidebar for Nav, Main Area for Content). Mobile-responsive (Sidebar becomes bottom nav or hamburger).
         2. Sections:
            - Overview: High-level summary, profile info, and a Chart.js visualization showing the distribution of the user's focus areas (AI, Utility, Work).
            - App Suite: A filterable grid of the functional buttons (OpenAI, Calc, etc.) allowing users to find tools by category.
            - Activities: A timeline/feed view of the blog posts and projects.
            - Connect: Social links and contact info presented as cards.
         3. Rationale: The original file was a long list. Grouping into a dashboard allows for a "Quick Glance" via charts and "Deep Dive" via specific tabs. 
    -->
    <!-- Visualization & Content Choices:
         1. Content Focus Chart (Overview): 
            - Goal: Inform the visitor about Jowon's primary expertise areas based on the links provided.
            - Visualization: Doughnut Chart (Chart.js).
            - Logic: Categorize links into 'AI', 'Utility', 'Profile', 'Work'.
            - Justification: Provides immediate visual context to the "AI & Cloud Architector" title.
         2. App Cards (App Suite):
            - Goal: Organize the scattered buttons into a clean, searchable interface.
            - Interaction: JS Filter by category (All, AI, Tools).
            - Justification: Improves findability as the list of tools grows.
         3. Activity Feed (Activities):
            - Goal: Present "Latest Activities" in a more engaging, chronological format.
            - Presentation: Vertical list with distinct styling for Projects vs Blog posts.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

                    content: '계절별 제철 채소와 해산물의 영양 가치를 극대화하는 수비드, 찜 조리 기법과 소금/설탕 사용을 줄이면서도 감칠맛을 살리는 건강 웰빙 레시피.'
                }
            ]
        };

        // Router & Navigation System
        const router = {
            currentRoute: 'overview',
            currentCategory: 'all',
            isBlogOpen: false,

            init: function() {
                const urlParams = new URLSearchParams(window.location.search);
                const routeParam = urlParams.get('route');
                const categoryParam = urlParams.get('category');
                const initialRoute = routeParam || 'overview';
                
                // 블로그 경로로 진입 시 서브메뉴 열기, 아니면 닫기
                this.setBlogSubnav(initialRoute === 'blog');

                this.navigate(initialRoute, categoryParam || 'all');
                this.setupMobileMenu();
            },
            normalizeCategory: function(cat) {
                if (!cat || cat === 'all' || cat === '전체보기') return 'all';
                if (cat === '일반앱' || cat === '일반 앱') return '일반 앱';
                return cat;
            },
            // 블로그 버튼 클릭 시 토글링 수행
            handleBlogClick: function(isMobile = false) {
                if (this.currentRoute === 'blog') {
                    // 이미 블로그 화면일 때 블로그 버튼을 다시 누르면 토글
                    this.setBlogSubnav(!this.isBlogOpen);
                } else {
                    // 다른 화면에서 블로그 버튼을 누르면 서브메뉴를 열고 블로그 전체 목록으로 이동
                    this.setBlogSubnav(true);
                    this.navigate('blog', 'all');
                }
            },
            // 블로그 서브메뉴 열림/닫힘 UI 제어
            setBlogSubnav: function(open) {
                this.isBlogOpen = open;
                const subnav = document.getElementById('subnav-blog');
                const arrow = document.getElementById('blog-toggle-arrow');
                const subnavMobile = document.getElementById('subnav-blog-mobile');
                const arrowMobile = document.getElementById('blog-toggle-arrow-mobile');

                if (subnav) {
                    if (open) {
                        subnav.classList.remove('hidden');
                    } else {
                        subnav.classList.add('hidden');
                    }
                }
                if (arrow) {
                    arrow.textContent = open ? '▼' : '▶';
                }

                if (subnavMobile) {
                    if (open) {
                        subnavMobile.classList.remove('hidden');
                    } else {
                        subnavMobile.classList.add('hidden');
                    }
                }
                if (arrowMobile) {
                    arrowMobile.textContent = open ? '▼' : '▶';
                }
            },
            updateSubnavUI: function(route, category) {
                const subnavMap = {
                    '일반 앱': 'subnav-apps-general',
                    '업무': 'subnav-apps-work',
                    '미디어': 'subnav-apps-media',
                    '게임': 'subnav-apps-game',
                    'all': 'subnav-blog-all',
                    'AI': 'subnav-blog-AI',
                    'IT': 'subnav-blog-IT',
                    'novel': 'subnav-blog-novel',
                    'travel': 'subnav-blog-travel',
                    'music': 'subnav-blog-music',
                    'movie': 'subnav-blog-movie',
                    'finance': 'subnav-blog-finance',
                    'cook': 'subnav-blog-cook'
                };
                
                document.querySelectorAll('.subnav-item').forEach(el => {
                    el.classList.remove('active', 'bg-blue-50', 'text-blue-600', 'font-semibold');
                    el.classList.add('text-slate-500');
                });

                if ((route === 'apps' || route === 'blog') && category && subnavMap[category]) {
                    const targetSubnav = document.getElementById(subnavMap[category]);
                    if (targetSubnav) {
                        targetSubnav.classList.remove('text-slate-500');
                        targetSubnav.classList.add('active', 'bg-blue-50', 'text-blue-600', 'font-semibold');
                    }
                }
            },
            navigate: function(route, category = 'all') {
                this.currentRoute = route;
                this.currentCategory = this.normalizeCategory(category);
                
                // 블로그 화면으로 이동 시(서브메뉴 클릭 등) 서브메뉴 열림 유지
                if (route === 'blog') {
                    this.setBlogSubnav(true);
                } else {
                    // 다른 화면(대시보드, 앱, 활동, 포트폴리오, 연락처)으로 이동 시 블로그 서브메뉴 자동 접기
                    this.setBlogSubnav(false);
                }

                // Update Nav UI
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.remove('active', 'bg-blue-50', 'text-blue-600');
                    if(el.id === `nav-${route}`) {
                        el.classList.add('active', 'bg-blue-50', 'text-blue-600');
                    }
                });

                // Update Subnav UI
                this.updateSubnavUI(route, this.currentCategory);

                // Hide Mobile Menu if open
                document.getElementById('mobileNav').classList.add('hidden');

                // Render View
                this.render(route, this.currentCategory);
            },
            render: function(route, category = 'all') {
                const contentArea = document.getElementById('content-area');
                const template = document.getElementById(`view-${route}`);
                
                if (!template) return;

                // Clear & Clone
                contentArea.innerHTML = '';
                const clone = template.content.cloneNode(true);
                contentArea.appendChild(clone);

                // Toggle padding for iframe compatibility on portfolio view
                if (route === 'portfolio') {
                    contentArea.classList.remove('p-4', 'md:p-8', 'overflow-y-auto');
                    contentArea.classList.add('p-0', 'overflow-hidden');
                } else {
                    contentArea.classList.remove('p-0', 'overflow-hidden');
                    contentArea.classList.add('p-4', 'md:p-8', 'overflow-y-auto');
                }

                // Initialize View Specific Logic
                if (route === 'overview') views.overview();
                if (route === 'apps') views.apps(category);
                if (route === 'activities') views.activities();
                if (route === 'connect') views.connect();
                if (route === 'blog') views.blog(category);
            },
            setupMobileMenu: function() {
                const btn = document.getElementById('mobileMenuBtn');
                const menu = document.getElementById('mobileNav');
                btn.addEventListener('click', () => {
                    menu.classList.toggle('hidden');
                });
            }
        };

        // View Logic
        const views = {
            overview: function() {
                // Populate Profile
                document.getElementById('profile-name').textContent = appData.user.name;
                document.getElementById('profile-title').textContent = appData.user.title;
                document.getElementById('stat-apps').textContent = appData.features.length;
                document.getElementById('stat-projects').textContent = appData.activities.length;

                // Featured Project
                const featured = appData.activities.find(a => a.type === 'Project') || appData.activities[0];
                const featContainer = document.getElementById('featured-project-container');
                featContainer.innerHTML = `
                    <div class="border border-slate-200 rounded-xl p-4 hover:shadow-md transition-shadow cursor-pointer" onclick="window.open('${featured.link}', '_blank')">
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded">${featured.type}</span>
                            <span class="text-slate-400 text-xs">🔗 바로가기</span>
                        </div>
                        <h4 class="font-bold text-slate-800">${featured.title}</h4>
                        <p class="text-sm text-slate-500 mt-1">${featured.desc}</p>
                    </div>
                `;

                // Render Chart
                this.renderChart();
            },

            renderChart: function() {
                const ctx = document.getElementById('skillsChart').getContext('2d');
                
                // Calculate Distribution
                const distribution = {};
                appData.features.forEach(f => {
                    distribution[f.category] = (distribution[f.category] || 0) + 1;
                });

                // Prepare Data
                const labels = Object.keys(distribution);
                const data = Object.values(distribution);
                const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899']; // Tailwind blue-500, green-500, amber-500, violet-500, pink-500

                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: colors,
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    usePointStyle: true,
                                    font: { family: "'Inter', sans-serif" }
                                }
                            }
                        },
                        cutout: '70%'
                    }
                });
            },

            apps: function(initialCategory = 'all') {
                const grid = document.getElementById('apps-grid');
                const filters = document.querySelectorAll('.filter-btn');
                const activeFilter = router.normalizeCategory(initialCategory);

                // Render Function
                const renderCards = (filter) => {
                    grid.innerHTML = '';
                    appData.features.forEach(app => {
                        if (filter === 'all' || app.category === filter) {
                            const card = document.createElement('a');
                            if (app.name === 'Blog') {
                                card.href = '#';
                                card.addEventListener('click', (e) => {
                                    e.preventDefault();
                                    router.navigate('blog');
                                });
                            } else if (app.name === 'Portfolio' || app.name === 'Mobile Portfolio') {
                                card.href = '#';
                                card.addEventListener('click', (e) => {
                                    e.preventDefault();
                                    router.navigate('portfolio');
                                });
                            } else {
                                card.href = app.link;
                            }
                            card.className = "group block bg-white rounded-xl p-6 border border-slate-200 hover:border-green-400 hover:shadow-md transition-all duration-300 relative overflow-hidden";
                            card.innerHTML = `
                                <div class="absolute top-0 left-0 w-1 h-full bg-slate-200 group-hover:bg-green-500 transition-colors"></div>
                                <div class="flex items-start justify-between mb-4 pl-2">
                                    <span class="text-4xl filter grayscale group-hover:grayscale-0 transition-all">${app.icon}</span>
                                    <span class="text-xs font-semibold text-slate-400 bg-slate-50 px-2 py-1 rounded border border-slate-100">${app.category}</span>
                                </div>
                                <h3 class="font-bold text-lg text-slate-800 group-hover:text-green-600 transition-colors pl-2">${app.name}</h3>
                                <p class="text-sm text-slate-500 mt-2 pl-2">${app.desc}</p>
                            `;
                            grid.appendChild(card);
                        }
                    });
                };

                const updateFilterButtons = (targetFilter) => {
                    filters.forEach(b => {
                        if (b.dataset.filter === targetFilter) {
                            b.classList.remove('bg-white', 'text-slate-600');
                            b.classList.add('bg-slate-800', 'text-white');
                        } else {
                            b.classList.remove('bg-slate-800', 'text-white');
                            b.classList.add('bg-white', 'text-slate-600');
                        }
                    });
                };

                // Filter Logic
                filters.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const selectedFilter = e.currentTarget.dataset.filter;
                        updateFilterButtons(selectedFilter);
                        renderCards(selectedFilter);
                        router.updateSubnavUI('apps', selectedFilter);
                    });
                });

                // Apply initial active filter and render
                updateFilterButtons(activeFilter);
                renderCards(activeFilter);
            },

            activities: function() {
                const container = document.getElementById('activity-timeline');
                appData.activities.forEach((act, index) => {
                    const item = document.createElement('div');
                    item.className = "relative pl-8";
                    
                    // Icon color logic
                    let iconColor = 'bg-blue-500';
                    if (act.type === 'Feature') iconColor = 'bg-emerald-500';
                    else if (act.type === 'Update') iconColor = 'bg-blue-600';
                    else if (act.type === 'Project') iconColor = 'bg-purple-500';
                    else if (act.type === 'Tool') iconColor = 'bg-amber-500';
                    else if (act.type === 'Report') iconColor = 'bg-teal-500';
                    else if (act.type === 'Game') iconColor = 'bg-pink-500';

                    // Date badge style logic
                    const isToday = act.date.includes('오늘');
                    const badgeStyle = isToday 
                        ? 'bg-blue-100 text-blue-800 border border-blue-200 font-bold' 
                        : 'bg-slate-100 text-slate-700 font-medium';
                    
                    const isLocalRoute = act.link.includes('?route=');
                    const routeName = isLocalRoute ? new URLSearchParams(act.link.split('?')[1]).get('route') : null;
                    
                    item.innerHTML = `
                        <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full border-2 border-white ${iconColor} shadow-sm"></div>
                        <div class="bg-white p-5 rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">${act.type}</span>
                                <span class="${badgeStyle} text-xs px-2.5 py-0.5 rounded-full">${act.date}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-1">
                                <a href="${act.link}" class="timeline-link hover:text-blue-600 transition-colors">${act.title}</a>
                            </h3>
                            <p class="text-sm text-slate-500 mb-3">${act.desc}</p>
                            <a href="${act.link}" class="timeline-link text-sm font-medium text-blue-600 hover:text-blue-800 inline-flex items-center">
                                바로가기 &rarr;
                            </a>
                        </div>
                    `;
                    
                    if (isLocalRoute && routeName) {
                        item.querySelectorAll('.timeline-link').forEach(el => {
                            el.addEventListener('click', (e) => {
                                e.preventDefault();
                                router.navigate(routeName);
                            });
                        });
                    }
                    
                    container.appendChild(item);
                });
            },

            connect: function() {
                const container = document.getElementById('connect-cards');
                appData.social.forEach(s => {
                    const card = document.createElement('a');
                    card.href = s.link;
                    card.target = "_blank";
                    card.className = `${s.color} text-white p-6 rounded-xl shadow-lg hover:opacity-90 transition-opacity flex flex-col items-center justify-center space-y-3 transform hover:-translate-y-1 duration-300`;
                    card.innerHTML = `
                        <span class="text-4xl">${s.icon}</span>
                        <span class="font-bold text-lg">${s.name}</span>
                        <span class="text-xs opacity-75 bg-white/20 px-3 py-1 rounded-full">Connect</span>
                    `;
                    container.appendChild(card);
                });
            },

            blog: function(initialCategory = 'all') {
                const categoriesView = document.getElementById('blog-categories-view');
                const detailView = document.getElementById('blog-category-detail-view');
                const cardsGrid = document.getElementById('blog-category-cards-grid');
                const iframe = document.getElementById('blog-category-iframe');
                const backBtn = document.getElementById('blog-back-to-categories-btn');
                const badge = document.getElementById('detail-category-badge');
                const extLink = document.getElementById('detail-category-extlink');

                const activeCategory = router.normalizeCategory(initialCategory);

                // 뒤로가기 버튼 클릭 시 전체 카테고리 목록으로 복귀
                if (backBtn) {
                    backBtn.onclick = () => {
                        router.navigate('blog', 'all');
                    };
                }

                // 1) 전체보기 모드 (8개 세부 카테고리 연결 카드 나열)
                if (activeCategory === 'all') {
                    if (categoriesView) categoriesView.classList.remove('hidden');
                    if (detailView) detailView.classList.add('hidden');

                    if (cardsGrid) {
                        cardsGrid.innerHTML = '';
                        appData.blogCategories.forEach(cat => {
                            const card = document.createElement('div');
                            
                            // 색상 매핑
                            const colorMap = {
                                purple: { border: 'hover:border-purple-400', badge: 'bg-purple-50 text-purple-700 border-purple-100', text: 'group-hover:text-purple-600', link: 'text-purple-600' },
                                emerald: { border: 'hover:border-emerald-400', badge: 'bg-emerald-50 text-emerald-700 border-emerald-100', text: 'group-hover:text-emerald-600', link: 'text-emerald-600' },
                                amber: { border: 'hover:border-amber-400', badge: 'bg-amber-50 text-amber-700 border-amber-100', text: 'group-hover:text-amber-600', link: 'text-amber-600' },
                                sky: { border: 'hover:border-sky-400', badge: 'bg-sky-50 text-sky-700 border-sky-100', text: 'group-hover:text-sky-600', link: 'text-sky-600' },
                                pink: { border: 'hover:border-pink-400', badge: 'bg-pink-50 text-pink-700 border-pink-100', text: 'group-hover:text-pink-600', link: 'text-pink-600' },
                                rose: { border: 'hover:border-rose-400', badge: 'bg-rose-50 text-rose-700 border-rose-100', text: 'group-hover:text-rose-600', link: 'text-rose-600' },
                                teal: { border: 'hover:border-teal-400', badge: 'bg-teal-50 text-teal-700 border-teal-100', text: 'group-hover:text-teal-600', link: 'text-teal-600' },
                                orange: { border: 'hover:border-orange-400', badge: 'bg-orange-50 text-orange-700 border-orange-100', text: 'group-hover:text-orange-600', link: 'text-orange-600' }
                            };
                            const c = colorMap[cat.color] || colorMap.purple;

                            card.className = `group bg-white rounded-2xl p-6 border border-slate-200 ${c.border} hover:shadow-xl transition-all duration-300 flex flex-col justify-between cursor-pointer relative overflow-hidden`;

                            card.innerHTML = `
                                <div>
                                    <div class="flex items-center justify-between mb-4">
                                        <span class="text-4xl filter group-hover:scale-110 transition-transform duration-200">${cat.icon}</span>
                                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${c.badge}">
                                            ${cat.tag}
                                        </span>
                                    </div>
                                    <h3 class="font-bold text-xl text-slate-800 ${c.text} transition-colors mb-2">${cat.name}</h3>
                                    <p class="text-sm text-slate-500 leading-relaxed mb-6">${cat.desc}</p>
                                </div>
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                                    <span class="text-xs text-slate-400 font-medium">📄 3개 포스팅</span>
                                    <span class="inline-flex items-center gap-1.5 text-xs font-bold ${c.link} group-hover:translate-x-1 transition-transform">
                                        <span>카테고리 홈 열기</span>
                                        <span>&rarr;</span>
                                    </span>
                                </div>
                            `;

                            // 카드 클릭 시 각 세부 카테고리의 index.html 연결
                            card.addEventListener('click', () => {
                                router.navigate('blog', cat.key);
                            });

                            cardsGrid.appendChild(card);
                        });
                    }
                } else {
                    // 2) 특정 카테고리 선택 모드 (해당 카테고리의 index.html iframe 로드)
                    if (categoriesView) categoriesView.classList.add('hidden');
                    if (detailView) detailView.classList.remove('hidden');

                    const categoryData = appData.blogCategories.find(c => c.key === activeCategory) || appData.blogCategories[0];
                    if (categoryData) {
                        if (iframe) iframe.src = categoryData.link;
                        if (badge) badge.textContent = `${categoryData.icon} ${categoryData.name} (${categoryData.link})`;
                        if (extLink) extLink.href = categoryData.link;
                    }
                }
            }
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            router.init();
        });

    </script>
</body>
</html>
