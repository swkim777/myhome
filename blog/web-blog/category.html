<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹블로그 - Jowon Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 p-6 md:p-10">
    <div class="max-w-4xl mx-auto space-y-8">
        <!-- 웹블로그 카테고리 헤더 배너 -->
        <div class="bg-blue-600 text-white rounded-2xl p-8 shadow-lg">
            <span class="text-4xl mb-4 block">🌐</span>
            <span class="text-xs font-bold tracking-widest uppercase bg-blue-500/50 px-3 py-1 rounded-full">Category</span>
            <h1 class="text-3xl font-bold mt-2">웹블로그 (Web Blog) 포스팅</h1>
            <p class="text-blue-100 mt-2">Next.js & TypeScript 기반 모던 웹 기술과 생성형 AI를 결합한 개인 기술 블로그 공간입니다.</p>
        </div>

        <!-- 카드 목록 그리드 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- MyBlog 카드: web-blog 폴더의 index.html로 직접 연결 -->
            <a href="index.html" class="block bg-white rounded-xl p-6 border border-slate-200 hover:border-blue-400 hover:shadow-md transition-all group">
                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full mb-3 inline-block">Web Blog</span>
                <h2 class="font-bold text-lg text-slate-800 group-hover:text-blue-600 mb-2">MyBlog</h2>
                <p class="text-xs text-slate-500 line-clamp-3">생성형 AI와 웹 기술의 만남, Next.js & TypeScript 기반 JOWON AI 개인 포트폴리오 및 기술 블로그입니다.</p>
                <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                    <span>2026.11</span>
                    <span class="text-blue-600 font-semibold group-hover:translate-x-0.5 transition-transform">열기 &rarr;</span>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
